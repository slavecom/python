/* 한 덩어리가 슬라이드보다 길어지지 않도록 잘게 펼친다 */
function expandBlocks(blocks){
  var out = [];
  (blocks || []).forEach(function(b){
    if(b.type === 'prompts' && b.items && b.items.length > 1){
      if(b.title) out.push({type:'h', text:b.title});
      if(b.lead)  out.push({type:'p', text:b.lead});
      b.items.forEach(function(it){ out.push({type:'prompt', items:[it]}); });
      return;
    }
    if(b.type === 'quiz' && b.items && b.items.length > 1){
      b.items.forEach(function(it, i){ out.push({type:'quiz', id:b.id, noHead:i > 0, items:[it]}); });
      return;
    }
    out.push(b);
  });
  return out;
}
function sectionById(id){
  for(var i = 0; i < SECTIONS.length; i++) if(SECTIONS[i].id === id) return SECTIONS[i];
  return null;
}
function slideShell(cls){
  var s = el('section', 'slide' + (cls ? ' ' + cls : ''));
  return s;
}
function foot(slide, mid){
  var f = el('div', 'p-foot');
  f.appendChild(el('span', '', T(UI.footL)));
  f.appendChild(el('span', 'mid', mid || ''));
  var r = el('span', 'no', '');
  f.appendChild(r);
  slide.appendChild(f);
  return r;
}
function coverSlide(){
  var s = slideShell('cover');
  var w = el('div', 'cover-wrap');
  w.appendChild(el('div', 'brand', T(UI.coverBrand)));
  w.appendChild(el('div', 'lv', T(UI.coverLv)));
  w.appendChild(el('h1', '', T(UI.coverTitle)));
  w.appendChild(el('div', 'sub', T(UI.coverSub)));
  var m = el('div', 'meta');
  T(UI.coverMeta).forEach(function(x){ m.appendChild(el('span', '', x)); });
  w.appendChild(m);
  s.appendChild(w);
  var no = foot(s, 'COVER');
  return {node:s, no:no, meta:m};
}
function partSlide(p){
  var s = slideShell('sect');
  var w = el('div', 'sect-wrap');
  w.appendChild(el('div', 'sect-no', p.no + '<small>PART</small>'));
  w.appendChild(el('div', 'sect-rule'));
  var r = el('div');
  r.style.flex = '1';
  r.appendChild(el('div', 'sect-eyebrow', T(p.name)));
  r.appendChild(el('div', 'sect-title', T(p.title)));
  r.appendChild(el('div', 'sect-sub', T(p.sub)));
  var c = el('div', 'sect-chips');
  T(p.chips).forEach(function(x){ c.appendChild(el('span', '', x)); });
  r.appendChild(c);
  w.appendChild(r);
  s.appendChild(w);
  var no = foot(s, T(p.name));
  return {node:s, no:no};
}
function contentSlide(sec, part, page){
  var s = slideShell();
  var top = el('div', 'topbar');
  top.appendChild(el('span', 'seg', '<span class="cn">' + sec.no + '</span>' + T(part.name)));
  top.appendChild(el('h2', '', T(sec.title)));
  var tag = el('span', 'tag', '');
  top.appendChild(tag);
  s.appendChild(top);
  var bd = el('div', 'bd');
  s.appendChild(bd);
  var no = foot(s, T(part.name));
  return {node:s, bd:bd, tag:tag, no:no};
}
function slideKind(bd){
  var hit = bd.querySelector('.anim, .case, canvas, .lab, .widget, .promptbox, .quiz, .codebox, table.tb, .goal, .steps');
  if(hit){
    if(hit.classList.contains('anim')) return {id:'anim', icon:'🎬', label:T(UI.tagAnim)};
    if(hit.classList.contains('case')) return {id:'case', icon:'🏢', label:T(UI.tagCase)};
    if(hit.tagName === 'CANVAS') return {id:'game', icon:'🎮', label:T(UI.tagGame)};
    if(hit.classList.contains('lab')) return {id:'lab', icon:'🖥', label:T(UI.tagVs)};
    if(hit.classList.contains('widget')) return {id:'lab', icon:'🧪', label:T(UI.tagLab)};
    if(hit.classList.contains('promptbox')) return {id:'prompt', icon:'💬', label:T(UI.tagPrompt)};
    if(hit.classList.contains('quiz')) return {id:'quiz', icon:'✍️', label:T(UI.tagQuiz)};
    if(hit.classList.contains('codebox')) return {id:'code', icon:'📄', label:T(UI.tagCode)};
  }
  return {id:'idea', icon:'💡', label:T(UI.tagIdea)};
}
function markSlide(cur, page){
  var k = slideKind(cur.bd);
  cur.node.classList.add('a-' + k.id);
  cur.tag.textContent = k.icon + ' ' + k.label + (page > 1 ? ' · ' + T(UI.cont) : '');
}

function buildDeck(){
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  SLIDES = [];
  var railHtml = [];

  var cv = coverSlide();
  stage.appendChild(cv.node);
  SLIDES.push({node:cv.node, no:cv.no, sec:'cover'});

  PARTS.forEach(function(part, pi){
    var ps = partSlide(part);
    stage.appendChild(ps.node);
    SLIDES.push({node:ps.node, no:ps.no, sec:'part' + pi});
    railHtml.push({grp:T(part.name)});

    part.ids.forEach(function(id){
      var sec = sectionById(id);
      if(!sec) return;
      var firstIndex = SLIDES.length;
      var page = 1;
      var cur = contentSlide(sec, part, page);
      stage.appendChild(cur.node);
      SLIDES.push({node:cur.node, no:cur.no, sec:id});

      var blocks = expandBlocks(sec.blocks);
      var i = 0;
      while(i < blocks.length){
        var group = [blocks[i]];
        /* 제목은 다음 블록과 붙여 둔다 */
        if((blocks[i].type === 'h' || blocks[i].type === 'sh') && blocks[i + 1]) group.push(blocks[i + 1]);
        var nodes = group.map(renderBlock);
        nodes.forEach(function(n){ cur.bd.appendChild(n); });
        if(cur.bd.scrollHeight > cur.bd.clientHeight + 2 && cur.bd.childElementCount > nodes.length){
          nodes.forEach(function(n){ cur.bd.removeChild(n); });
          markSlide(cur, page);
          page++;
          cur = contentSlide(sec, part, page);
          stage.appendChild(cur.node);
          SLIDES.push({node:cur.node, no:cur.no, sec:id});
          nodes.forEach(function(n){ cur.bd.appendChild(n); });
        }
        i += group.length;
      }
      markSlide(cur, page);
      railHtml.push({id:id, no:sec.no, t:T(sec.title), idx:firstIndex});
    });
  });

  /* 번호 매기기 */
  var total = SLIDES.length;
  SLIDES.forEach(function(s, i){
    s.node.dataset.i = i;
    s.no.textContent = (i + 1) + ' / ' + total + '  ·  ' + T(UI.footR);
  });
  if(cv.meta){
    cv.meta.querySelectorAll('span').forEach(function(sp){
      sp.textContent = sp.textContent.replace('%N', total);
    });
  }

  /* 레일 */
  var rail = document.getElementById('railList');
  rail.innerHTML = '';
  railHtml.forEach(function(r){
    if(r.grp){ rail.appendChild(el('div', 'rl-grp', r.grp)); return; }
    var a = el('div', 'rl-item', '<span class="n">' + r.no + '</span><span class="t">' + esc(r.t) + '</span>');
    a.dataset.sec = r.id;
    a.onclick = function(){ goSlide(r.idx); };
    rail.appendChild(a);
  });

  document.getElementById('rlTitle').textContent = T(UI.deck);
  document.getElementById('rlSub').textContent = T(UI.rlSub);
  document.getElementById('hDl').textContent = T(UI.dl);
  document.getElementById('kbhint').textContent = T(UI.kb);
  document.getElementById('btnTheme').textContent =
    document.documentElement.dataset.theme === 'light' ? T(UI.dark) : T(UI.light);
  document.documentElement.lang = LANG;
  document.title = LANG === 'ko' ? '기초공학 프로그래밍 · 게임으로 거꾸로 배우는 파이썬'
                                 : 'Intro to Engineering Programming · Python backwards from a game';
  fitZoom(true);
  onScroll();
}

/* ===================== 이동 · 확대 · 테마 ===================== */
var ZOOM = 1, AUTOZOOM = true;
function applyZoom(){
  document.documentElement.style.setProperty('--s', ZOOM);
  document.getElementById('pgZoom').textContent = Math.round(ZOOM * 100) + '%';
}
function fitZoom(auto){
  if(auto && !AUTOZOOM) return;
  var rail = document.body.classList.contains('norail') ? 0 : 231;
  var avail = window.innerWidth - rail - 56;
  ZOOM = Math.min(1, Math.max(.34, avail / 1180));
  applyZoom();
}
function zoom(d){
  AUTOZOOM = false;
  ZOOM = Math.min(1.8, Math.max(.3, ZOOM + d * 0.1));
  applyZoom();
}
function curIndex(){
  var best = 0, bestTop = -1e9;
  for(var i = 0; i < SLIDES.length; i++){
    var top = SLIDES[i].node.getBoundingClientRect().top - 40;
    if(top <= 0 && top > bestTop){ bestTop = top; best = i; }
  }
  return best;
}
function goSlide(i){
  if(i < 0) i = SLIDES.length - 1;
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  var y = SLIDES[i].node.getBoundingClientRect().top + window.scrollY - 14;
  window.scrollTo({top:y, behavior:'smooth'});
}
function stepSlide(d){ goSlide(curIndex() + d); }
function onScroll(){
  var i = curIndex();
  document.getElementById('pgCnt').textContent =
    String(i + 1).padStart(2, '0') + ' / ' + String(SLIDES.length).padStart(2, '0');
  var h = document.documentElement;
  document.getElementById('progress').style.width =
    (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
  var sec = SLIDES[i] ? SLIDES[i].sec : '';
  document.querySelectorAll('.rl-item').forEach(function(a){
    a.classList.toggle('on', a.dataset.sec === sec);
  });
  var on = document.querySelector('.rl-item.on');
  if(on && on.offsetParent){
    var box = on.getBoundingClientRect(), list = document.getElementById('railList').getBoundingClientRect();
    if(box.top < list.top + 8 || box.bottom > list.bottom - 8) on.scrollIntoView({block:'center'});
  }
}
function toggleRail(){
  document.body.classList.toggle('norail');
  document.getElementById('railToggle').textContent =
    document.body.classList.contains('norail') ? '›' : '‹';
  fitZoom(true);
}
function toggleTheme(){
  var h = document.documentElement;
  h.dataset.theme = (h.dataset.theme === 'light') ? 'dark' : 'light';
  document.getElementById('btnTheme').textContent =
    h.dataset.theme === 'light' ? T(UI.dark) : T(UI.light);
}
function setLang(l){
  if(l === LANG) return;
  var i = curIndex(), sec = SLIDES[i] ? SLIDES[i].sec : null;
  LANG = l;
  document.getElementById('btnKo').className = (l === 'ko' ? 'on' : '');
  document.getElementById('btnEn').className = (l === 'en' ? 'on' : '');
  buildDeck();
  if(sec){
    for(var k = 0; k < SLIDES.length; k++) if(SLIDES[k].sec === sec){ goSlide(k); break; }
  }
}
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', function(){ fitZoom(true); });
window.addEventListener('keydown', function(e){
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(typeof MG !== 'undefined' && MG && MG.active &&
     ['ArrowLeft','ArrowRight',' ','Spacebar','p','P','r','R'].indexOf(e.key) >= 0) return;
  var k = e.key;
  if(k === 'PageDown' || k === 'ArrowRight' || k === 'ArrowDown'){ e.preventDefault(); stepSlide(1); }
  else if(k === 'PageUp' || k === 'ArrowLeft' || k === 'ArrowUp'){ e.preventDefault(); stepSlide(-1); }
  else if(k === 'Home'){ e.preventDefault(); goSlide(0); }
  else if(k === 'End'){ e.preventDefault(); goSlide(-1); }
  else if(k === '+' || k === '='){ zoom(1); }
  else if(k === '-' || k === '_'){ zoom(-1); }
  else if(k === '0'){ AUTOZOOM = true; fitZoom(true); }
  else if(k === 'm' || k === 'M'){ toggleRail(); }
  else if(k === 'l' || k === 'L'){ setLang(LANG === 'ko' ? 'en' : 'ko'); }
  else if(k === 't' || k === 'T'){ toggleTheme(); }
});

  MG.bf.textContent = T(GAMEUI.fire);

}
function mgInit(){
  var W = 320, H = 440;
  var C = {bg:'#0a0e1e', player:'#56d6ff', bullet:'#ffe478', enemy:'#ff6a7a', boss:'#bc84ff', text:'#ebf0ff', dim:'#7884a8'};
  var SET = {spawn_delay:44, enemy_speed:1.2, level_up_score:120};
  var ctx = MG.cv.getContext('2d');
  var g, best = 0, keys = {};

  function newGame(){
    return {px:W/2, cool:0, lives:3, bullets:[], enemies:[], score:0, level:1, timer:0, state:'ready', msg:'', msgT:0};
  }
  g = newGame();

  function spawnWave(level){
    var wave = [];
    for(var i = 0; i < 2 + Math.floor(level/2); i++){
      wave.push({x:20 + Math.random()*(W-40), y:-20 - Math.random()*110, size:18, hp:1, pts:10,
                 sp:SET.enemy_speed + level*0.16, boss:false, dir:1});
    }
    if(level % 5 === 0){
      wave.push({x:W/2, y:-70, size:43, hp:6 + level*2, pts:120,
                 sp:(SET.enemy_speed + level*0.16)*0.55, boss:true, dir:1});
      g.msg = LANG === 'ko' ? '보스 등장!' : 'BOSS INCOMING!'; g.msgT = 90;
    }
    return wave;
  }
  function dist(ax, ay, bx, by){ return Math.sqrt(Math.pow(ax-bx,2) + Math.pow(ay-by,2)); }

  function step(){
    if(g.state === 'play'){
      if(keys.left) g.px -= 3.2;
      if(keys.right) g.px += 3.2;
      if(g.px < 11) g.px = 11;
      else if(g.px > W - 11) g.px = W - 11;
      if(g.cool > 0) g.cool--;
      if(keys.fire && g.cool <= 0){ g.cool = 9; g.bullets.push({x:g.px, y:H - 48}); }

      g.timer++;
      if(g.timer % SET.spawn_delay === 0) g.enemies = g.enemies.concat(spawnWave(g.level));

      g.bullets.forEach(function(b){ b.y -= 6.5; });
      g.enemies.forEach(function(e){
        e.y += e.sp;
        if(e.boss){ e.x += e.dir * 1.5; if(e.x < e.size/2 || e.x > W - e.size/2) e.dir *= -1; }
      });

      g.bullets.forEach(function(b){
        g.enemies.forEach(function(e){
          if(b.dead || e.dead) return;
          if(dist(b.x, b.y, e.x, e.y) < e.size/2 + 4){
            b.dead = true; e.hp--;
            if(e.hp <= 0){ e.dead = true; g.score += e.pts; }
          }
        });
      });
      g.enemies.forEach(function(e){
        if(e.dead) return;
        if(Math.abs(e.x - g.px) < e.size/2 + 13 && e.y > H - 62 && e.y < H - 14){
          e.dead = true; g.lives--;
          if(g.lives <= 0){
            g.state = 'over';
            if(g.score > best){ best = g.score; g.msg = LANG === 'ko' ? '새 최고점!' : 'NEW BEST!'; g.msgT = 150; }
          }
        }
      });
      g.bullets = g.bullets.filter(function(b){ return !b.dead && b.y > -10; });
      g.enemies = g.enemies.filter(function(e){ return !e.dead && e.y < H + 40; });
      g.level = Math.floor(g.score / SET.level_up_score) + 1;
      if(g.msgT > 0) g.msgT--;
    }
    draw();
    requestAnimationFrame(step);
  }

  function draw(){
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    g.enemies.forEach(function(e){
      ctx.fillStyle = e.boss ? C.boss : C.enemy;
      ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
      if(e.boss){ ctx.fillStyle = C.bg; ctx.fillRect(e.x - e.size/2 + 13, e.y - e.size/2 + 23, e.size - 26, e.size - 46); }
    });
    ctx.fillStyle = C.bullet;
    g.bullets.forEach(function(b){ ctx.fillRect(b.x - 2, b.y - 7, 4, 11); });
    ctx.fillStyle = C.player;
    ctx.beginPath();
    ctx.moveTo(g.px, H - 42); ctx.lineTo(g.px - 11, H - 21); ctx.lineTo(g.px + 11, H - 21);
    ctx.closePath(); ctx.fill();

    ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = C.text;
    ctx.fillText((LANG === 'ko' ? '점수 ' : 'SCORE ') + g.score + '   ' + (LANG === 'ko' ? '단계 ' : 'LV ') + g.level, 8, 16);
    ctx.textAlign = 'right'; ctx.fillStyle = C.dim;
    ctx.fillText('@'.repeat(Math.max(0, g.lives)), W - 8, 16);
    ctx.textAlign = 'center';
    if(g.state === 'ready'){
      ctx.fillStyle = C.text; ctx.font = 'bold 22px monospace'; ctx.fillText('SPACE DEFENDER', W/2, H/2 - 14);
      ctx.font = '12px monospace'; ctx.fillStyle = C.dim;
      ctx.fillText(LANG === 'ko' ? '시작 버튼 또는 스페이스' : 'press start or space', W/2, H/2 + 12);
    }else if(g.state === 'pause'){
      ctx.fillStyle = C.text; ctx.font = 'bold 16px monospace';
      ctx.fillText(LANG === 'ko' ? '잠시멈춤 (P)' : 'PAUSED (P)', W/2, H/2);
    }else if(g.state === 'over'){
      ctx.fillStyle = C.text; ctx.font = 'bold 24px monospace';
      ctx.fillText(LANG === 'ko' ? '게임 끝' : 'GAME OVER', W/2, H/2 - 10);
      ctx.font = '13px monospace'; ctx.fillStyle = C.dim;
      ctx.fillText((LANG === 'ko' ? '점수 ' : 'SCORE ') + g.score + (LANG === 'ko' ? ' · R 다시하기' : ' · R to retry'), W/2, H/2 + 16);
    }
    if(g.msgT > 0){ ctx.fillStyle = C.boss; ctx.font = 'bold 14px monospace'; ctx.fillText(g.msg, W/2, 54); }

    var s = document.getElementById('mgScore');
    if(s){
      s.textContent = g.score;
      document.getElementById('mgLevel').textContent = g.level;
      document.getElementById('mgLives').textContent = '@'.repeat(Math.max(0, g.lives)) || '-';
      document.getElementById('mgBest').textContent = best;
      document.getElementById('mgVars').textContent =
        'state   = "' + g.state + '"\n' +
        'score   = ' + g.score + '\n' +
        'level   = score // ' + SET.level_up_score + ' + 1 = ' + g.level + '\n' +
        'bullets = [' + g.bullets.length + (LANG === 'ko' ? '개' : ' items') + ']\n' +
        'enemies = [' + g.enemies.length + (LANG === 'ko' ? '개' : ' items') + ']\n' +
        'timer   = ' + g.timer + '   (timer % ' + SET.spawn_delay + ' == 0 -> ' + (LANG === 'ko' ? '새 무리' : 'new wave') + ')';
    }
  }

  function press(k, on){
    if(k === 'ArrowLeft') keys.left = on;
    else if(k === 'ArrowRight') keys.right = on;
    else if(k === ' ' || k === 'Spacebar'){ keys.fire = on; if(on && g.state === 'ready') g.state = 'play'; }
    else if(on && (k === 'p' || k === 'P')){ g.state = g.state === 'play' ? 'pause' : (g.state === 'pause' ? 'play' : g.state); }
    else if(on && (k === 'r' || k === 'R')){ if(g.state === 'over'){ g = newGame(); g.state = 'play'; } }
  }
  MG.cv.addEventListener('click', function(){ MG.active = true; MG.cv.focus(); });
  MG.cv.addEventListener('blur', function(){ MG.active = false; keys = {}; });
  window.addEventListener('keydown', function(e){
    if(!MG.active) return;
    if(['ArrowLeft','ArrowRight',' ','Spacebar','p','P','r','R'].indexOf(e.key) >= 0){ e.preventDefault(); press(e.key, true); }
  });
  window.addEventListener('keyup', function(e){
    if(!MG.active) return;
    press(e.key, false);
  });
  function hold(btn, k){
    var down = function(ev){ ev.preventDefault(); press(k, true); };
    var up = function(ev){ ev.preventDefault(); press(k, false); };
    btn.addEventListener('mousedown', down); btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, {passive:false}); btn.addEventListener('touchend', up, {passive:false});
  }
  hold(MG.bl, 'ArrowLeft'); hold(MG.br, 'ArrowRight'); hold(MG.bf, ' ');
  MG.sb.onclick = function(){ if(g.state === 'ready' || g.state === 'pause') g.state = 'play'; else if(g.state === 'over'){ g = newGame(); g.state = 'play'; } MG.active = true; MG.cv.focus(); };
  MG.rb.onclick = function(){ g = newGame(); };
  requestAnimationFrame(step);
}

/* ===================== 직접 해보기 위젯 ===================== */
function L(ko, en){ return T({ko:ko, en:en}); }
function outBox(host){ var o = el('div', 'out'); host.appendChild(o); return o; }
function rowOf(host){ var r = el('div', 'row'); host.appendChild(r); return r; }
function mkBtn(label, cls, fn){ var b = el('button', cls || 'btn', label); b.onclick = fn; return b; }
function pyType(v){
  var s = v.trim();
  if(s === 'True' || s === 'False') return 'bool';
  if(s === 'None') return 'NoneType';
  if(/^-?\d+$/.test(s)) return 'int';
  if(/^-?\d*\.\d+$/.test(s)) return 'float';
  if(/^".*"$|^'.*'$/.test(s)) return 'str';
  if(/^\[.*\]$/.test(s)) return 'list';
  if(/^\{.*:.*\}$/.test(s)) return 'dict';
  if(/^\(.*,.*\)$/.test(s)) return 'tuple';
  return 'str';
}

      'a // b = ' + (y === 0 ? 'ZeroDivisionError' : Math.floor(x / y)) + L('   <- 몫만', '   <- quotient only') + '\n' +
      'a % b  = ' + (y === 0 ? 'ZeroDivisionError' : (x % y)) + L('   <- 나머지', '   <- remainder') + '\n' +
      'a ** 2 = ' + Math.pow(x, 2) + '\n' +
      'a > b  = ' + (x > y ? 'True' : 'False') + '   a == b = ' + (x === y ? 'True' : 'False') + '\n' +

      'enemy.size / 2 + 6 = ' + lim + '\n\n' +
      d.toFixed(2) + ' < ' + lim + '  ->  ' + (d < lim ? 'True' : 'False') + '   ' +
      (d < lim ? L('맞았다! 점수 +10', 'hit! score +10') : L('빗나갔다', 'missed'));

WIDGETS.ifchain = function(host){

/* --- 4장 반복문 --- */
WIDGETS.loops = function(host){
  host.appendChild(el('h4', 'sh', L('for 문 한 걸음씩 · spawn_wave(level)', 'step the for loop · spawn_wave(level)')));
  var r = rowOf(host);
  r.appendChild(el('label', '', 'level'));
  var lv = el('input'); lv.type = 'number'; lv.value = '5'; lv.min = '1'; lv.max = '20'; lv.style.width = '80px';
  r.appendChild(lv);
  var i = -1, wave = [], lvl = 5;
  var stepB = mkBtn(L('한 걸음', 'one step'), 'btn pri', function(){ stepOne(); });
  var allB = mkBtn(L('끝까지', 'run to end'), 'btn', function(){ while(i < 2 + Math.floor(lvl/2) ) stepOne(); });
  var resB = mkBtn(L('처음부터', 'reset'), 'btn', function(){ reset(); });
  r.appendChild(stepB); r.appendChild(allB); r.appendChild(resB);
  var o = outBox(host);
  function reset(){ lvl = Number(lv.value) || 1; i = -1; wave = []; show(L('아직 시작하지 않음', 'not started yet')); }
  function stepOne(){
    var total = 2 + Math.floor(lvl/2);
    if(i < total - 1){
      i++;
      wave.push('Enemy(x=' + (40 + Math.floor(Math.random()*560)) + ', speed=' + (1.6 + lvl*0.22).toFixed(2) + ')');
      show('for i in range(2 + ' + lvl + ' // 2):   i = ' + i + '   -> wave.append(Enemy(...))');
    }else if(i === total - 1){
      i++;
      if(lvl % 5 === 0){ wave.push('Boss(hp=' + (6 + lvl*2) + ')'); show('if ' + lvl + ' % 5 == 0:  -> True   ' + L('보스도 넣는다', 'boss joins the wave')); }
      else show('if ' + lvl + ' % 5 == 0:  -> False   ' + L('보스 없음', 'no boss') + '\nreturn wave');
    }else{
      show('return wave   ' + L('길이 ', 'length ') + wave.length);
    }
  }
  function show(msg){
    o.textContent = msg + '\n\nwave = [\n  ' + (wave.length ? wave.join(',\n  ') : '') + '\n]   len(wave) = ' + wave.length;
  }
  lv.oninput = reset;
  reset();

  host.appendChild(el('h4', 'sh', L('while 문 · 게임 루프가 프레임을 세는 방식', 'the while loop · how the game counts frames')));
  var r2 = rowOf(host);
  var t2 = 0, run = false;
  var o2 = outBox(host);
  var go = mkBtn(L('루프 돌리기 / 멈추기', 'run / stop the loop'), 'btn pri', function(){ run = !run; tick(); });
  r2.appendChild(go);
  r2.appendChild(mkBtn(L('한 프레임', 'one frame'), 'btn', function(){ t2++; paint(); }));
  function paint(){
    o2.textContent =
      'while running:            ' + L('# 지금 ', '# frame ') + t2 + L('번째 프레임', '') + '\n' +
      '    clock.tick(60)        ' + L('# 1초에 60번', '# 60 times a second') + '\n' +
      '    game["timer"] += 1    -> timer = ' + t2 + '\n' +
      '    timer % 44 == 0  ->  ' + (t2 % 44 === 0 && t2 > 0 ? 'True   ' + L('적 무리 등장!', 'a wave spawns!') : 'False') + '\n' +
      '    ' + L('경과 시간 약 ', 'elapsed about ') + (t2 / 60).toFixed(2) + L('초', 's');
  }
  function tick(){ if(!run) return; t2++; paint(); setTimeout(tick, 1000/60 * 6); }
  paint();
};

  var cur = 'ok', useTry = true, btns = [];

var VIBE_PROMPT_EN = `Write me a shooting game in Python. Use pygame only, and keep it in one file (game.py).

[What the game does]
1. A triangle ship sits at the bottom and moves with the left and right arrow keys. It cannot leave the screen.
2. Space fires a bullet. Put a cooldown between shots so it does not spray.
3. Square enemies keep falling from the top. A bullet removes one and adds 10 points.
4. Touching an enemy costs one life; at 0 lives the game is over. R restarts it.
5. Every 120 points the level goes up, and higher levels send more enemies, faster.
6. Every fifth level a boss appears: bigger, takes several hits, and sweeps left and right.
7. Show score, level and lives at the top left, and the best score at the top right.
8. Keep the best score in highscore.json so it survives a restart.
9. P pauses, L switches the on-screen text between Korean and English.

[Write the code this way - it becomes course material]
1. Put settings such as window size, speeds and lives at the top as capitalised variables.
2. Keep colors and numeric settings in dictionaries, and on-screen text in a per-language dictionary.
3. Pull repeated work into functions: drawing text, distance between two points, working out the level, and building a wave of enemies.
4. Make player, bullet, enemy and boss classes. Shared parts live in a parent class; the boss inherits from the enemy.

    {type:'sh', text:{ko:'함수 안의 변수는 함수 밖에서 보이지 않는다', en:'Variables inside a function stay inside'}},
    {type:'p', text:{ko:'draw_text 안에서 만든 font, image, rect 는 그 함수가 끝나면 사라집니다. 다른 곳에서 rect 라고 써도 이 rect 가 아닙니다. 이것을 지역변수라고 하고, 덕분에 함수 이름만 겹치지 않게 하면 서로 간섭하지 않습니다. 반대로 함수 밖의 값을 바꿔야 하는 경우가 하나 있습니다. 311줄의 global LANG 입니다. LANG 은 파일 맨 위에 있는 값이고 main() 안에서 L 키를 누를 때 이 값을 바꿔야 하므로, "이건 밖에 있는 그 LANG 이다" 라고 따로 표시해 준 것입니다.',

    {type:'p', text:{ko:'예외처리는 많이 쓰면 좋은 것이 아닙니다. 오류를 잡아 조용히 넘기면, 프로그램이 잘못 돌고 있는데도 아무도 모르게 됩니다. 기준은 이렇습니다. 내 잘못이 아니고 어차피 일어나는 일(파일이 없다, 인터넷이 끊겼다, 사용자가 이상한 값을 넣었다)은 막습니다. 반대로 내가 코드를 잘못 쓴 것(변수 이름 오타, 자료형 착각)은 막지 말고 오류가 나게 두어야 합니다. 그래야 고칠 수 있습니다. 119줄의 except Exception: 처럼 모든 오류를 뭉뚱그려 잡는 것은 꼭 필요한 곳에만 써야 합니다. 이 게임에서는 컴퓨터마다 글꼴 사정이 달라 무슨 오류가 날지 예측할 수 없기 때문에 그렇게 두었습니다.',

/* ===================== 애니메이션 · 사례 · 실습 블록 ===================== */
var ANIMS = {};

function animBlock(b){
  var host = el('div', 'anim');
  var h = el('div', 'ah', '🎬 ' + T(b.title));
  h.appendChild(el('span', 'sp'));
  var bStep = el('button', '', LANG === 'ko' ? '한 걸음' : 'step');
  var bPlay = el('button', '', LANG === 'ko' ? '▶ 이어서 재생' : '▶ play');
  var bReset = el('button', '', LANG === 'ko' ? '처음부터' : 'reset');
  h.appendChild(bStep); h.appendChild(bPlay); h.appendChild(bReset);
  host.appendChild(h);

  var body = el('div', 'ab');
  var stage = el('div', 'astage');
  var narr = el('div', 'narr');
  body.appendChild(stage); body.appendChild(narr);
  host.appendChild(body);

  var api = ANIMS[b.kind](stage);
  var steps = api.steps, i = -1, timer = null;

  steps.forEach(function(s, k){
    var li = el('div', 'nl', '<i>' + (k + 1) + '</i><span>' + T(s.label) + '</span>');
    li.onclick = function(){ stop(); reset(); for(var j = 0; j <= k; j++) fire(j); };
    narr.appendChild(li);
  });
  function paint(){
    [].forEach.call(narr.children, function(li, k){
      li.className = 'nl' + (k === i ? ' on' : (k < i ? ' done' : ''));
    });
  }
  function fire(k){ i = k; steps[k].run(); paint(); }
  function step(){ if(i < steps.length - 1) fire(i + 1); }
  function play(){
    stop();
    timer = setInterval(function(){
      if(i >= steps.length - 1){ stop(); return; }
      fire(i + 1);
    }, api.dur || 1500);
  }
  function stop(){ if(timer){ clearInterval(timer); timer = null; } }
  function reset(){ stop(); i = -1; api.reset(); paint(); }
  bStep.onclick = function(){ stop(); step(); };
  bPlay.onclick = play;
  bReset.onclick = reset;
  reset();
  setTimeout(function(){ if(narr.isConnected) fire(0); }, 120);
  return host;
}

      {label:{ko:'LANG = "ko" — 지금 화면에 쓸 언어를 담아 둡니다. 값이 바뀔 상자입니다.',
              en:'LANG = "ko" — it holds the language in use. This is a box whose value will change.'},
       run:function(){ hl(2); var c = chip('l', '"ko"', 'str'); setTimeout(function(){ moveTo(c, 346, 178); }, 60); }},
      {label:{ko:'pygame 이 창을 만들 때 WIDTH 상자를 열어 640 을 꺼내 씁니다 — set_mode((WIDTH, HEIGHT))',

/* ---------- 2장 · 거리 계산과 나머지 ---------- */
ANIMS.ops = function(stage){
  stage.innerHTML = '';
  var cv = document.createElement('canvas');
  var W = Math.max(520, stage.clientWidth || 700), H = 264;
  cv.width = W; cv.height = H;
  stage.appendChild(cv);
  var ctx = cv.getContext('2d');
  var SPLIT = Math.round(W * 0.52);
  var st = {by:230, show:0, hit:false, timer:0};

  function draw(){
    var cw = stage.clientWidth || W;
    if(cw !== W){ W = cw; SPLIT = Math.round(W * 0.52); cv.width = W; }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(0, 0, SPLIT, H);
    var ex = Math.round(SPLIT * 0.58), ey = 74, size = 52, bx = ex - 24;
    ctx.fillStyle = '#ff6a7a'; ctx.fillRect(ex - size/2, ey - size/2, size, size);
    ctx.fillStyle = '#ffe478'; ctx.fillRect(bx - 3, st.by - 9, 6, 16);
    ctx.font = '12px monospace'; ctx.fillStyle = '#9fb0cf';
    ctx.fillText('enemy (' + ex + ', ' + ey + ')', ex + 24, ey - 22);
    ctx.fillText('bullet (' + bx + ', ' + Math.round(st.by) + ')', bx - 46, st.by + 26);
    if(st.show >= 1){
      ctx.strokeStyle = '#56d6ff'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(bx, st.by); ctx.lineTo(ex, st.by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex, st.by); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#56d6ff';
      ctx.fillText('ax - bx = ' + (bx - ex), (bx + ex)/2 - 34, st.by + 15);
      ctx.fillText('ay - by = ' + Math.round(st.by - ey), ex + 8, (st.by + ey)/2);
    }
    if(st.show >= 2){
      ctx.strokeStyle = '#8ff0c6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx, st.by); ctx.lineTo(ex, ey); ctx.stroke();
    }
    var dx = bx - ex, dy = st.by - ey, d = Math.sqrt(dx*dx + dy*dy), lim = size/2 + 6;
    ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#eaf1ff';
    var L = SPLIT + 24, y = 42;
    ctx.fillText('(ax-bx) ** 2 = ' + (dx*dx), L, y); y += 28;
    ctx.fillText('(ay-by) ** 2 = ' + Math.round(dy*dy), L, y); y += 28;
    if(st.show >= 2){ ctx.fillStyle = '#8ff0c6'; ctx.fillText('math.sqrt(...) = ' + d.toFixed(1), L, y); }
    y += 32;
    if(st.show >= 3){
      ctx.fillStyle = '#ffce6a'; ctx.fillText('size/2 + 6 = ' + lim, L, y); y += 28;
      ctx.fillStyle = d < lim ? '#8ff0c6' : '#ff8fb0';
      ctx.fillText(d.toFixed(1) + ' < ' + lim + ' -> ' + (d < lim ? 'True' : 'False'), L, y);
    }
    if(st.hit){
      ctx.fillStyle = '#8ff0c6'; ctx.font = 'bold 17px monospace';
      ctx.fillText(LANG === 'ko' ? '맞았다 · score += 10' : 'HIT · score += 10', L, 212);
    }
    if(st.show >= 4){
      ctx.fillStyle = '#9fb0cf'; ctx.font = '11px monospace';
      ctx.fillText('timer ' + st.timer + '   timer % 44 = ' + (st.timer % 44), 16, 252);
      for(var i = 0; i <= 88; i += 4){
        var on = (i <= st.timer);
        ctx.fillStyle = (i % 44 === 0) ? (on ? '#ffce6a' : 'rgba(255,206,106,.3)')
                                       : (on ? 'rgba(126,166,255,.8)' : 'rgba(126,166,255,.18)');
        ctx.fillRect(16 + i*(SPLIT-40)/88, 234, 3, 9);
      }
    }
  }
  function reset(){ st.by = 232; st.show = 0; st.hit = false; st.timer = 0; draw(); }
  return {
    dur:1600, reset:reset,
    steps:[
      {label:{ko:'총알과 적은 화면 위의 점 두 개입니다. 맞았는지 알려면 두 점이 얼마나 가까운지를 구해야 합니다.',
              en:'A bullet and an enemy are two points. To know if it hit, we need how close they are.'},
       run:function(){ st.by = 232; st.show = 0; st.hit = false; draw(); }},
      {label:{ko:'가로 차이와 세로 차이를 뺄셈으로 구합니다 — (ax - bx), (ay - by). 부호는 상관없습니다.',
              en:'Subtraction gives the horizontal and vertical gaps — (ax - bx), (ay - by). The sign does not matter.'},
       run:function(){ st.by = 196; st.show = 1; draw(); }},
      {label:{ko:'각각 제곱(**)해서 더하고 math.sqrt 로 제곱근을 냅니다. 직각삼각형의 빗변, 곧 두 점 사이 거리입니다.',
              en:'Square each with **, add them, take math.sqrt: the hypotenuse, which is the distance.'},
       run:function(){ st.by = 158; st.show = 2; draw(); }},
      {label:{ko:'그 거리를 기준값과 비교합니다 — 적 반지름 26 + 총알 반지름 6 = 32. 비교 연산자의 답은 True 나 False 뿐입니다.',
              en:'Compare that distance with the limit — enemy radius 26 + bullet radius 6 = 32. A comparison answers only True or False.'},
       run:function(){ st.by = 126; st.show = 3; draw(); }},
      {label:{ko:'총알이 더 다가와 거리가 32보다 작아지는 순간 True 가 되고, 그때 점수가 10 올라갑니다.',
              en:'As the bullet closes in, the distance drops under 32, the test turns True and the score goes up by 10.'},
       run:function(){ st.by = 90; st.show = 3; st.hit = true; draw(); }},
      {label:{ko:'나머지 연산자 %는 주기를 만듭니다. timer % 44 == 0 인 순간(노란 눈금)마다 적 무리가 한 번씩 나옵니다.',
              en:'The remainder % builds a cycle: each time timer % 44 == 0 (the amber ticks) a wave spawns.'},
       run:function(){ st.show = 4; st.timer = 88; draw(); }}
    ]
  };
};

var _renderBlockBase = renderBlock;
renderBlock = function(b){
  if(b.type === 'anim') return animBlock(b);
  if(b.type === 'case'){
    var c = el('div', 'case');
    c.appendChild(el('div', 'ch', '🏢 ' + T(b.title)));
    var body = el('div', 'cb');
    if(b.lead) body.appendChild(el('p', '', T(b.lead)));
    if(b.bad || b.good){
      var sp = el('div', 'csplit');
      if(b.bad)  sp.appendChild(el('div', 'cbad',  '<b>' + T(b.badLabel || {ko:'이렇게 두면', en:'Left like this'}) + '</b>' + T(b.bad)));
      if(b.good) sp.appendChild(el('div', 'cgood', '<b>' + T(b.goodLabel || {ko:'이렇게 바꾸면', en:'Changed to this'}) + '</b>' + T(b.good)));
      body.appendChild(sp);
    }
    if(b.why) body.appendChild(el('div', 'cwhy', T(b.why)));
    c.appendChild(body);
    return c;
  }
  if(b.type === 'lab'){
    var l = el('div', 'lab');
    l.appendChild(el('div', 'lh', '🖥 ' + T(b.title)));
    var lb = el('div', 'lb');
    var ol = el('ol');
    b.steps.forEach(function(s){ ol.appendChild(el('li', '', T(s))); });
    lb.appendChild(ol);
    if(b.check) lb.appendChild(el('div', 'chk', '<b>' + T({ko:'확인할 것', en:'What to check'}) + '</b> · ' + T(b.check)));
    l.appendChild(lb);
    return l;
  }
  if(b.type === 'vsmock'){
    var m = el('div', 'vsmock');
    m.innerHTML =
      '<div class="vstop"><span class="vsdot"></span><span>' + esc(T(b.title)) + '</span></div>' +
      '<div class="vsbody"><div class="vsside">' +
        (b.files || []).map(function(f){ return '<div class="f' + (f.on ? ' on' : '') + '">' + esc(T(f.n)) + '</div>'; }).join('') +
      '</div><div class="vsmain">' +
        (b.lines || []).map(function(x){ return '<div>' + (x.bp ? '<span class="bp">●</span> ' : '') + esc(T(x.t || x)) + '</div>'; }).join('') +
      '</div></div>' +
      (b.term ? '<div class="vsterm">' + esc(T(b.term)) + '</div>' : '');
    return m;
  }
  return _renderBlockBase(b);
};

/* ---------------- 합치기 ---------------- */
(function(){
  function find(blocks, type){
    for(var i = 0; i < blocks.length; i++) if(blocks[i].type === type) return i;
    return -1;
  }
  Object.keys(EXTRA).forEach(function(id){
    var sec = null;
    for(var i = 0; i < SECTIONS.length; i++) if(SECTIONS[i].id === id) sec = SECTIONS[i];
    if(!sec) return;
    var ex = EXTRA[id], b = sec.blocks;

    /* 목표 바로 뒤에 애니메이션 */
    var gi = find(b, 'goal');
    if(ex.anim) b.splice(gi + 1, 0, ex.anim);

    /* 위젯 뒤에 작은 예제 */
    var wi = find(b, 'widget');
    if(ex.example && wi >= 0) b.splice.apply(b, [wi + 1, 0].concat(ex.example));

    /* 프롬프트 앞에 실무 사례와 VS Code 실습 */
    var pi = find(b, 'prompts');
    if(pi < 0) pi = b.length;
    var add = [];
    if(ex.caseStudy) add.push(ex.caseStudy);
    if(ex.lab) add.push(ex.lab);
    b.splice.apply(b, [pi, 0].concat(add));
  });

  /* VS Code 준비 섹션을 PART 0 에 넣는다 */
  SECTIONS.push(SEC_VSCODE);
  var ids = PARTS[0].ids;
  if(ids.indexOf('vs') < 0) ids.splice(2, 0, 'vs');

  /* 번호를 덱 순서대로 다시 매긴다 */
  var n = 0;
  PARTS.forEach(function(p){
    p.ids.forEach(function(id){
      for(var i = 0; i < SECTIONS.length; i++) if(SECTIONS[i].id === id){
        SECTIONS[i].no = (n < 10 ? '0' : '') + n; n++;
      }
    });
  });
})();
