<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기초공학 프로그래밍 · 게임으로 거꾸로 배우는 파이썬</title>
<style>
:root{
  --samsung:#2f6bff; --samsung-d:#7ea6ff; --samsung-l:#5b8cff; --sky:#7ea6ff;
  --ink:#eaf1ff; --muted:#9fb0cf; --bg:#060f24;
  --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.12);
  --good:#3ddc9b; --good-bg:rgba(61,220,155,.12);
  --bad:#ff6b81;  --bad-bg:rgba(255,107,129,.12);
  --warn:#ffce6a; --warn-bg:rgba(255,193,84,.12);
  --purple:#b39cf5; --purple-bg:rgba(179,156,245,.14);
  --gold:#7ea6ff;
  --shadow:0 30px 80px rgba(4,10,30,.55);
  --code-bg:#0a1430; --code-ink:#e7ecfb;
  --mono:"D2Coding","Consolas","SFMono-Regular","Menlo","Courier New",monospace;
  --sans:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
  --rail:231px;
}
html[data-theme="light"]{
  --ink:#16233f; --muted:#5b6c8c; --bg:#eef2f9;
  --card:#ffffff; --line:rgba(22,35,63,.14);
  --samsung:#1544c9; --samsung-d:#1f56e8; --samsung-l:#4a7cff; --sky:#2f6bff; --gold:#2f6bff;
  --good:#0f8a5f; --good-bg:rgba(15,138,95,.10);
  --bad:#d63a55;  --bad-bg:rgba(214,58,85,.10);
  --warn:#9a6100; --warn-bg:rgba(255,193,84,.16);
  --purple:#6b45c7; --purple-bg:rgba(107,69,199,.10);
  --shadow:0 18px 44px rgba(18,34,68,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#12245a 0%,var(--bg) 60%) fixed;
  padding:0 0 74px var(--rail); -webkit-text-size-adjust:100%;
}
html[data-theme="light"] body{background:radial-gradient(1200px 700px at 80% -10%,#dbe6ff 0%,var(--bg) 60%) fixed}
h1,h2,h3,h4{line-height:1.3}
button{font-family:inherit;cursor:pointer}
a{color:var(--samsung-d)}
code{font-family:var(--mono);font-size:.93em;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
html[data-theme="light"] code{background:rgba(22,35,63,.06)}

/* ================= 좌측 레일 ================= */
#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:70;
  background:rgba(6,15,36,.94);backdrop-filter:blur(10px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s}
html[data-theme="light"] #rail{background:rgba(255,255,255,.96)}
#rail .rl-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
#rail .rl-head b{display:block;font-size:13.5px;font-weight:900;line-height:1.35;color:var(--ink)}
#rail .rl-head small{display:block;margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.rl-list{flex:1;overflow:auto;padding:10px 9px 136px}
.rl-list::-webkit-scrollbar{width:8px}
.rl-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.rl-grp{font-size:10.5px;font-weight:900;letter-spacing:.14em;color:var(--samsung-d);
  padding:12px 8px 6px;text-transform:uppercase}
.rl-item{display:flex;gap:10px;align-items:flex-start;padding:8px 9px;border-radius:10px;
  cursor:pointer;transition:.15s;border:1px solid transparent;margin-bottom:2px}
.rl-item:hover{background:rgba(255,255,255,.06)}
html[data-theme="light"] .rl-item:hover{background:rgba(22,35,63,.05)}
.rl-item .n{flex:0 0 26px;height:20px;border-radius:6px;background:rgba(255,255,255,.10);
  color:var(--muted);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
html[data-theme="light"] .rl-item .n{background:rgba(22,35,63,.09)}
.rl-item .t{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rl-item.on{background:rgba(47,107,255,.20);border-color:rgba(126,166,255,.45)}
.rl-item.on .n{background:var(--samsung);color:#fff}
.rl-item.on .t{color:var(--ink)}
#railToggle{position:fixed;left:calc(var(--rail) - 13px);top:50%;z-index:71;width:26px;height:52px;
  border-radius:0 10px 10px 0;border:1px solid var(--line);border-left:0;background:rgba(6,15,36,.94);
  color:var(--muted);font-size:13px;font-weight:900;transition:.2s}
html[data-theme="light"] #railToggle{background:rgba(255,255,255,.96)}
body.norail{padding-left:0}
body.norail #rail{transform:translateX(-100%)}
body.norail #railToggle{left:0;border-radius:0 10px 10px 0}
body.norail .rl-list{padding-bottom:18px}

/* ================= 상단 우측 버튼 ================= */
#tools{position:fixed;left:0;bottom:0;width:var(--rail);z-index:71;display:flex;flex-wrap:wrap;gap:7px;
  align-items:center;padding:10px;background:rgba(6,15,36,.97);border-top:1px solid var(--line);border-right:1px solid var(--line)}
html[data-theme="light"] #tools{background:rgba(255,255,255,.97)}
body.norail #tools{left:auto;right:18px;top:16px;bottom:auto;width:auto;background:transparent;border:0;padding:0}
#tools .tool.dl{flex:1 0 100%;text-align:center}
body.norail #tools .tool.dl{flex:none}
.tool{border:1px solid var(--line);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);
  color:var(--ink);font-size:12px;font-weight:800;padding:8px 13px;border-radius:999px;transition:.15s}
.tool:hover{background:rgba(255,255,255,.16)}
html[data-theme="light"] .tool{background:rgba(255,255,255,.92)}
.langbtn{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,.07);backdrop-filter:blur(8px)}
html[data-theme="light"] .langbtn{background:rgba(255,255,255,.92)}
.langbtn button{border:0;background:transparent;padding:8px 13px;font-size:12px;font-weight:800;color:var(--muted)}
.langbtn button.on{background:var(--samsung);color:#fff}
.tool.dl{background:linear-gradient(135deg,#2f6bff,#5b8cff);border-color:rgba(255,255,255,.25);color:#fff}

/* ================= 무대와 슬라이드 ================= */
#stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 20px 40px}
.slide{width:1180px;height:680px;flex:none;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 90% at 84% 10%, rgba(47,107,255,.28), rgba(47,107,255,0) 46%),
    radial-gradient(90% 80% at 6% 100%, rgba(47,107,255,.13), rgba(47,107,255,0) 55%),
    linear-gradient(150deg,#0d1d40 0%,#0a1633 45%,#060f24 100%);
  border:1px solid rgba(255,255,255,.06);border-radius:22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:scale(var(--s,1));transform-origin:top center;
  margin-bottom:calc((var(--s,1) - 1) * 680px);scroll-margin-top:14px}
html[data-theme="light"] .slide{background:
    radial-gradient(120% 90% at 84% 10%, rgba(47,107,255,.10), rgba(47,107,255,0) 46%),
    linear-gradient(150deg,#ffffff 0%,#f7faff 45%,#eef3fd 100%);border-color:rgba(22,35,63,.10)}
.topbar{height:64px;flex:0 0 64px;background:none;border-bottom:1px solid rgba(255,255,255,.12);
  color:var(--ink);display:flex;align-items:center;gap:12px;padding:0 28px}
html[data-theme="light"] .topbar{border-bottom-color:rgba(22,35,63,.14)}
.topbar .seg{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;
  font-weight:700;color:var(--samsung-d);white-space:nowrap}
.topbar .cn{background:var(--samsung);color:#fff;border-radius:6px;min-width:23px;height:19px;
  padding:0 6px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);letter-spacing:0}
.topbar h2{font-size:20px;font-weight:800;flex:1;line-height:1.2;letter-spacing:-.2px;color:var(--ink)}
.topbar .tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink)}
.a-idea   .tag{background:rgba(126,166,255,.16);border-color:rgba(126,166,255,.45);color:#cfe0ff}
.a-code   .tag{background:rgba(86,214,255,.16); border-color:rgba(86,214,255,.45); color:#b6ecff}
.a-lab    .tag{background:rgba(179,156,245,.16);border-color:rgba(179,156,245,.5); color:#ddd2ff}
.a-prompt .tag{background:rgba(255,206,106,.16);border-color:rgba(255,206,106,.5); color:#ffe3a6}
.a-quiz   .tag{background:rgba(61,220,155,.16); border-color:rgba(61,220,155,.45); color:#8ff0c6}
.a-game   .tag{background:rgba(255,107,129,.16);border-color:rgba(255,107,129,.45);color:#ffb3bd}
.a-anim   .tag{background:rgba(86,214,255,.16); border-color:rgba(86,214,255,.5);  color:#b6ecff}
.a-case   .tag{background:rgba(255,159,110,.16);border-color:rgba(255,159,110,.5); color:#ffd0b8}
.a-anim   .cn{background:#1c7fa8}
.a-case   .cn{background:#b05a29}
.a-anim   .seg{color:#56d6ff}
.a-case   .seg{color:#ff9f6e}
html[data-theme="light"] .a-case .seg{color:#a8480f}
.a-code   .cn{background:#1c7fa8}
.a-lab    .cn{background:#6b45c7}
.a-prompt .cn{background:#b58200}
.a-quiz   .cn{background:#1c8a67}
.a-game   .cn{background:#c53a51}
.a-idea   .seg{color:#7ea6ff}
.a-code   .seg{color:#56d6ff}
.a-lab    .seg{color:#b39cf5}
.a-prompt .seg{color:#ffce6a}
.a-quiz   .seg{color:#3ddc9b}
.a-game   .seg{color:#ff6b81}
html[data-theme="light"] .a-code .seg{color:#0d6d93}
html[data-theme="light"] .a-lab .seg{color:#6b45c7}
html[data-theme="light"] .a-prompt .seg{color:#9a6100}
html[data-theme="light"] .a-quiz .seg{color:#0f8a5f}
html[data-theme="light"] .a-game .seg{color:#c53a51}
html[data-theme="light"] .topbar .tag{color:var(--ink)}
.bd{flex:1;padding:22px 38px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.bd>*{flex:0 0 auto}
.bd::-webkit-scrollbar{width:8px}
.bd::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.p-foot{flex:0 0 33px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;
  border-top:1px solid rgba(255,255,255,.12);background:rgba(6,15,36,.4);
  font-size:11px;font-weight:600;letter-spacing:.4px;color:#6f80a3}
html[data-theme="light"] .p-foot{border-top-color:rgba(22,35,63,.12);background:rgba(22,35,63,.03);color:#5b6c8c}
.p-foot .mid{font-weight:900;letter-spacing:.14em}

/* ---- PART 구분 · 표지 ---- */
.slide.sect{background:linear-gradient(135deg,#0a1836 0%,#060f24 56%,#0d2350 100%);border-color:#1b2b55}
html[data-theme="light"] .slide.sect{background:linear-gradient(135deg,#f4f7fc 0%,#eaf0fb 56%,#e2ebfd 100%)}
.sect-wrap{flex:1;display:flex;align-items:center;gap:52px;padding:0 64px;position:relative}
.sect-no{font-size:150px;font-weight:900;line-height:.85;letter-spacing:-.06em;font-family:var(--mono);
  background:linear-gradient(150deg,#9fc0ff,#2f6bff 72%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sect-no small{display:block;font-size:14px;letter-spacing:.3em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:12px;font-family:var(--sans)}
.sect-rule{width:1px;align-self:stretch;margin:70px 0;background:var(--line)}
.sect-eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:900;
  letter-spacing:.26em;color:var(--samsung-d);margin-bottom:14px}
.sect-eyebrow:before{content:"";width:46px;height:2px;background:var(--samsung-d)}
.sect-title{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:1.05;color:var(--ink)}
.sect-title .b{color:var(--samsung-d)}
.sect-sub{font-size:17px;margin-top:16px;color:var(--muted);font-weight:600;line-height:1.6}
.sect-chips{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap}
.sect-chips span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;
  padding:8px 15px;font-weight:800;font-size:12.5px;color:var(--ink)}
.slide.cover{background:linear-gradient(120deg,#0b1a73 0%,#060f24 48%,#2b54d4 100%)}
html[data-theme="light"] .slide.cover{background:linear-gradient(120deg,#1a3bb8 0%,#2f6bff 55%,#5b8cff 100%)}
.cover-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 70px;color:#fff}
.cover-wrap .brand{font-size:13px;letter-spacing:.3em;font-weight:900;opacity:.85;margin-bottom:20px}
.cover-wrap h1{font-size:54px;font-weight:900;line-height:1.1;letter-spacing:-1.2px;color:#fff}
.cover-wrap .lv{display:inline-block;font-size:13px;letter-spacing:.14em;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 16px;font-weight:900;margin-bottom:18px}
.cover-wrap .sub{font-size:18px;margin-top:20px;opacity:.94;font-weight:600;line-height:1.6}
.cover-wrap .meta{display:flex;gap:11px;margin-top:34px;flex-wrap:wrap}
.cover-wrap .meta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:9px 17px;font-weight:800;font-size:13.5px}
.slide.cover .p-foot,.slide.sect .p-foot{color:rgba(255,255,255,.55);border-top-color:rgba(255,255,255,.14)}
html[data-theme="light"] .slide.sect .p-foot{color:var(--muted);border-top-color:var(--line)}

/* ================= 본문 블록 ================= */
.lead{font-size:15.5px;line-height:1.72;color:var(--ink)}
.bd p{font-size:14.5px;line-height:1.75;color:var(--muted)}
.bd p b,.bd p strong{color:var(--ink)}
h3.bh{font-size:16px;font-weight:900;color:var(--samsung-d);display:flex;align-items:center;gap:9px;margin-top:2px}
h3.bh:before{content:"";width:8px;height:18px;background:var(--gold);border-radius:3px;flex:none}
h4.sh{font-size:14.5px;font-weight:900;color:var(--ink);margin-top:2px}
.goal{background:rgba(255,255,255,.04);border-left:5px solid var(--warn);
  border-radius:0 12px 12px 0;padding:11px 16px}
html[data-theme="light"] .goal{background:rgba(22,35,63,.035)}
.goal>b{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;
  color:var(--warn);background:var(--warn-bg);border:1px solid rgba(255,193,84,.45);
  border-radius:999px;padding:3px 11px}
.goal>b:before{content:"🎯"}
.goal ul{margin:7px 0 0;padding-left:19px}
.goal li{font-size:14px;line-height:1.6;color:var(--ink);margin:3px 0}
.note,.warn,.key{border-radius:13px;padding:12px 16px;font-size:14px;line-height:1.66;color:var(--ink)}
.note{background:var(--warn-bg);border:1.5px solid rgba(255,193,84,.45)}
.note b{color:var(--warn);font-weight:900}
.warn{background:var(--bad-bg);border:1.5px solid rgba(255,107,129,.45)}
.warn b{color:var(--bad);font-weight:900}
.key{background:var(--good-bg);border:1.5px solid rgba(61,220,155,.45)}
.key b{color:var(--good);font-weight:900}
ul.pl,ol.pl{padding-left:21px}
ul.pl li,ol.pl li{font-size:14px;line-height:1.65;color:var(--ink);margin:4px 0}
table.tb{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow:auto;max-height:420px}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;color:var(--ink);line-height:1.55}
table.tb th{background:rgba(47,107,255,.16);font-size:12px;font-weight:900;color:var(--samsung-d);white-space:nowrap}
table.tb tr:nth-child(even) td{background:rgba(255,255,255,.03)}
html[data-theme="light"] table.tb tr:nth-child(even) td{background:rgba(22,35,63,.03)}

.steps{display:flex;flex-direction:column;gap:9px;max-height:470px;overflow:auto}
.steps .st{position:relative;padding-left:36px;font-size:14px;line-height:1.66;color:var(--muted)}
.steps .st b{display:block;color:var(--ink);font-weight:900;font-size:14.5px}
.steps .st:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:25px;height:25px;
  border-radius:50%;background:var(--samsung);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.steps{counter-reset:s}

/* ---- 코드 ---- */
.codebox{border-radius:13px;overflow:hidden;border:1px solid rgba(86,214,255,.35);background:var(--code-bg)}
html[data-theme="light"] .codebox{border-color:rgba(22,35,63,.2)}
.codebar{display:flex;align-items:center;gap:10px;padding:8px 13px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(126,166,255,.22)}
html[data-theme="light"] .codebar{background:rgba(255,255,255,.08)}
.codebar .fn{font-family:var(--mono);font-size:11.5px;color:#7fd8f5;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codebar button{border:1px solid rgba(126,166,255,.45);background:rgba(47,107,255,.22);color:#dbe7ff;
  font-size:11px;font-weight:900;padding:4px 11px;border-radius:999px}
.codebar button:hover{background:rgba(47,107,255,.42)}
.codebar button.done{background:var(--good);border-color:var(--good);color:#04240f}
pre.code{margin:0;padding:11px 0;overflow:auto;color:var(--code-ink);font-family:var(--mono);font-size:12.3px;line-height:1.62;background:var(--code-bg)}
pre.code .ln{display:flex}
pre.code .ln>i{flex:none;width:50px;padding-right:13px;text-align:right;color:#5a6b96;font-style:normal;user-select:none}
pre.code .ln>span{white-space:pre;padding-right:16px}
pre.code .ln.hl{background:rgba(126,166,255,.12)}
pre.code .ln.hl>i{color:#9fc0ff}
.tk-kw{color:#ff8fb0}.tk-def{color:#7de3ff}.tk-str{color:#ffd482}.tk-num{color:#8ff0c6}
.tk-cm{color:#8b9ac4;font-style:italic}.tk-bi{color:#c6a8ff}.tk-self{color:#ff9f6e}

/* ---- 프롬프트 ---- */
.promptbox{border:1px solid rgba(255,206,106,.5);background:rgba(255,255,255,.035);border-radius:13px;padding:13px 16px}
.promptbox .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.promptbox .ph b{font-size:13.2px;font-weight:800;color:var(--warn)}
.promptbox .ph button{margin-left:auto;border:1px solid rgba(255,206,106,.6);background:rgba(255,206,106,.18);
  color:var(--warn);font-weight:800;font-size:11.5px;padding:4px 12px;border-radius:999px}
.promptbox .ph button.done{background:var(--warn);color:#2a1c00}
.promptbox .pt{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--ink);
  background:rgba(4,10,30,.5);border:1px solid var(--line);border-radius:10px;padding:11px 13px;max-height:330px;overflow:auto}
html[data-theme="light"] .promptbox .pt{background:rgba(255,255,255,.85)}

/* ---- 위젯 ---- */
.widget{border:1px solid rgba(179,156,245,.5);border-radius:13px;overflow:hidden;background:rgba(255,255,255,.035)}
html[data-theme="light"] .widget{background:rgba(47,107,255,.04)}
.wh{display:flex;align-items:center;gap:9px;padding:9px 14px;background:rgba(179,156,245,.19);
  border-bottom:1px solid rgba(179,156,245,.5);font-size:13.8px;font-weight:800;color:var(--purple)}
.wh .tag{font-size:10.5px;font-weight:900;color:#fff;background:var(--purple);border-radius:999px;padding:2px 9px}
.wb{padding:13px 15px}
.wb p{font-size:13.5px;margin-bottom:9px}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:9px}
.row label{font-size:12.5px;color:var(--muted);font-weight:700}
input[type=text],input[type=number],select{font-family:var(--mono);font-size:13px;padding:6px 9px;
  border:1px solid var(--line);border-radius:9px;background:rgba(4,10,30,.45);color:var(--ink);min-width:0}
html[data-theme="light"] input[type=text],html[data-theme="light"] input[type=number],html[data-theme="light"] select{background:#fff}
input[type=range]{accent-color:var(--samsung-l)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:9px}
.btn:hover{border-color:var(--samsung-l);color:var(--samsung-d)}
.btn.pri{background:var(--samsung);border-color:var(--samsung);color:#fff}
.btn.pri:hover{background:var(--samsung-l);color:#fff}
.btn.sm{padding:4px 9px;font-size:11.5px}
.out{font-family:var(--mono);font-size:12.5px;background:rgba(4,10,30,.55);color:var(--code-ink);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.62;overflow:auto;max-height:240px}
html[data-theme="light"] .out{background:#0a1430;color:#e7ecfb}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(126,166,255,.38);background:rgba(255,255,255,.05);border-radius:999px;
  padding:4px 11px;font-size:12px;font-family:var(--mono);color:var(--samsung-d);font-weight:700}
.chip.on{background:var(--samsung);border-color:var(--samsung);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini{border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:11px 13px;background:rgba(255,255,255,.035)}
.mini b{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:900;letter-spacing:.06em}
.big{font-family:var(--mono);font-size:18px;font-weight:900;color:var(--ink)}
.stage{position:relative;background:rgba(4,10,30,.6);border:1px solid var(--line);border-radius:11px;height:104px;overflow:hidden}
.ship{position:absolute;bottom:12px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-bottom:23px solid #56d6ff;transform:translateX(-50%);transition:left .08s linear}
.wall{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,#ff6a7a 0 6px,transparent 6px 12px)}

/* ---- 퀴즈 ---- */
.quiz{border:1px solid rgba(61,220,155,.45);border-radius:13px;padding:13px 16px;background:rgba(255,255,255,.035)}
html[data-theme="light"] .quiz{background:rgba(47,107,255,.04)}
.quiz>b{font-size:13.8px;font-weight:800;color:var(--good)}
.q{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .qt{font-weight:800;font-size:14px;color:var(--ink);margin-bottom:8px}
.q .qt em{font-family:var(--mono);font-style:normal;color:var(--purple);margin-right:7px;font-weight:900}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;
  padding:8px 12px;font-size:13.5px;color:var(--ink);display:flex;gap:9px;align-items:flex-start;font-weight:600}
html[data-theme="light"] .opt{background:#fff}
.opt:hover{border-color:var(--samsung-l)}
.opt>span{overflow-wrap:anywhere}
.opt i{font-style:normal;font-family:var(--mono);color:var(--muted);flex:none;font-weight:900}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:900}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.why{margin-top:8px;font-size:13px;line-height:1.66;background:rgba(47,107,255,.12);border:1px solid rgba(126,166,255,.3);
  border-radius:10px;padding:9px 12px;color:var(--ink);display:none}
.why.show{display:block}
.why b{color:var(--samsung-d);font-weight:900}

/* ---- 게임 ---- */
.gamewrap{display:grid;grid-template-columns:minmax(0,352px) minmax(200px,1fr);gap:14px;align-items:start}
.gamebox{background:rgba(4,10,30,.6);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.gamebox canvas{width:100%;max-width:296px;height:auto;background:#0a0e1e;border-radius:10px;touch-action:none}
.anim canvas{display:block;width:100%;height:264px}
.gamebox .hint{color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono);line-height:1.5}
.pad{display:flex;gap:7px;justify-content:center;margin-top:8px}
.pad button{flex:1;max-width:100px;background:rgba(47,107,255,.2);border:1px solid rgba(126,166,255,.4);
  color:var(--ink);border-radius:10px;padding:9px 0;font-weight:800;font-size:12.5px}
.gamewrap .grid2{grid-template-columns:1fr 1fr}

/* ================= 하단 페이저 ================= */
#pager{position:fixed;left:calc(50% + var(--rail)/2);bottom:16px;transform:translateX(-50%);z-index:75;
  display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  background:rgba(6,15,36,.86);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
html[data-theme="light"] #pager{background:rgba(255,255,255,.94)}
body.norail #pager{left:50%}
#pager button{border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:900;
  width:30px;height:30px;border-radius:50%;line-height:1}
#pager button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
#pager .cnt{font-family:var(--mono);font-size:13px;font-weight:900;color:var(--ink);min-width:74px;text-align:center}
#pager .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#pager .zm{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--muted);min-width:44px;text-align:center}
#kbhint{position:fixed;right:16px;bottom:22px;z-index:74;font-size:10.5px;font-weight:700;color:var(--muted);
  background:rgba(6,15,36,.7);border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px)}
html[data-theme="light"] #kbhint{background:rgba(255,255,255,.85)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:80;
  background:linear-gradient(90deg,var(--samsung),var(--purple));transition:width .2s}
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,16px);background:var(--samsung);color:#fff;
  font-size:13px;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transition:.2s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= 애니메이션 · 사례 · 실습 ================= */
.anim{border:1px solid rgba(86,214,255,.38);border-radius:13px;background:rgba(255,255,255,.035);overflow:hidden}
.anim .ah{display:flex;align-items:center;gap:9px;padding:8px 13px;background:rgba(86,214,255,.14);
  border-bottom:1px solid rgba(86,214,255,.32);font-size:13.5px;font-weight:800;color:#7fd8f5}
html[data-theme="light"] .anim .ah{color:#0d6d93}
.anim .ah .sp{flex:1}
.anim .ah button{border:1px solid rgba(86,214,255,.5);background:rgba(86,214,255,.16);color:#9fe4fb;
  font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px}
html[data-theme="light"] .anim .ah button{color:#0d6d93}
.anim .ah button:hover{background:rgba(86,214,255,.3)}
.anim .ab{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}
.anim .astage{position:relative;height:264px;border-radius:11px;background:rgba(4,10,30,.55);
  border:1px solid var(--line);overflow:hidden}
html[data-theme="light"] .anim .astage{background:#0a1430}
.anim .narr{display:flex;flex-direction:column;gap:4px}
.anim .narr .nl{font-size:12.5px;line-height:1.5;color:var(--muted);padding:6px 10px;border-radius:9px;
  border:1px solid transparent;display:flex;gap:8px}
.anim .narr .nl i{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.75;flex:none}
.anim .narr .nl.on{background:rgba(86,214,255,.14);border-color:rgba(86,214,255,.35);color:var(--ink);font-weight:700}
.anim .narr .nl.done{color:var(--muted);opacity:.7}
.vbox{position:absolute;border:2px solid rgba(126,166,255,.7);border-radius:10px;background:rgba(47,107,255,.10)}
.vbox .vname{position:absolute;top:-11px;left:10px;background:#0a1430;padding:0 7px;font-family:var(--mono);
  font-size:11px;font-weight:900;color:#9fc0ff}
.vchip{position:absolute;font-family:var(--mono);font-size:12.5px;font-weight:900;border-radius:8px;
  padding:4px 10px;background:#2f6bff;color:#fff;box-shadow:0 6px 18px rgba(47,107,255,.45);
  transition:left .75s cubic-bezier(.35,.1,.2,1),top .75s cubic-bezier(.35,.1,.2,1),opacity .5s,transform .5s}
.vchip.gone{opacity:0;transform:translateY(26px) rotate(8deg)}
.vchip.str{background:#ffce6a;color:#2a1c00}
.vchip.num{background:#3ddc9b;color:#04240f}
.vcode{position:absolute;font-family:var(--mono);font-size:12px;line-height:1.75;color:#8b9ac4}
.vcode .cl{padding:1px 8px;border-radius:6px;transition:.3s}
.vcode .cl.on{background:rgba(126,166,255,.18);color:#eaf1ff}
.vscreen{position:absolute;border:2px dashed rgba(159,176,207,.5);border-radius:8px;transition:width .8s,height .8s}
.vlabel{position:absolute;font-family:var(--mono);font-size:11px;color:#9fb0cf}
.vflow{position:absolute;inset:0}
.vnode{position:absolute;border-radius:10px;border:1.5px solid rgba(159,176,207,.45);background:rgba(255,255,255,.05);
  padding:7px 11px;font-size:12.5px;font-weight:800;color:#cfd8f5;transition:.3s;text-align:center}
.vnode.diam{border-color:rgba(255,206,106,.6);background:rgba(255,206,106,.12);color:#ffe3a6}
.vnode.on{border-color:#56d6ff;background:rgba(86,214,255,.22);color:#fff;box-shadow:0 0 0 3px rgba(86,214,255,.18)}
.vnode.ok{border-color:#3ddc9b;background:rgba(61,220,155,.2);color:#8ff0c6}
.vnode small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;opacity:.8;margin-top:2px}
.vedge{position:absolute;height:2px;background:rgba(159,176,207,.35);transform-origin:left center}
.vedge.on{background:#56d6ff;box-shadow:0 0 10px rgba(86,214,255,.6)}
.vedge span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#9fb0cf}
.vtok{position:absolute;width:15px;height:15px;border-radius:50%;background:#56d6ff;box-shadow:0 0 14px #56d6ff;
  transition:left .6s ease,top .6s ease}

.case{border:1px solid rgba(255,159,110,.5);border-radius:13px;background:rgba(255,255,255,.035);overflow:hidden}
.case .ch{display:flex;align-items:center;gap:9px;padding:9px 14px;background:rgba(255,159,110,.16);
  border-bottom:1px solid rgba(255,159,110,.45);font-size:13.5px;font-weight:800;color:#ffb894}
html[data-theme="light"] .case .ch{color:#a8480f}
.case .cb{padding:12px 15px;display:flex;flex-direction:column;gap:9px}
.case .cb p{font-size:13.5px;line-height:1.7}
.case .csplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.case .cbad,.case .cgood{border-radius:11px;padding:10px 12px;font-size:12.8px;line-height:1.65}
.case .cbad{background:var(--bad-bg);border:1px solid rgba(255,107,129,.42)}
.case .cgood{background:var(--good-bg);border:1px solid rgba(61,220,155,.42)}
.case .cbad b{color:var(--bad);display:block;margin-bottom:4px;font-size:12px}
.case .cgood b{color:var(--good);display:block;margin-bottom:4px;font-size:12px}
.case .cwhy{font-size:12.8px;color:var(--muted);line-height:1.65;border-top:1px dashed var(--line);padding-top:8px}

.lab{border:1px solid rgba(61,220,155,.5);border-radius:13px;background:rgba(255,255,255,.035);overflow:hidden}
.lab .lh{display:flex;align-items:center;gap:9px;padding:9px 14px;background:rgba(61,220,155,.16);
  border-bottom:1px solid rgba(61,220,155,.45);font-size:13.5px;font-weight:800;color:#8ff0c6}
html[data-theme="light"] .lab .lh{color:#0f6b4a}
.lab .lb{padding:12px 15px}
.lab ol{counter-reset:l;list-style:none;display:flex;flex-direction:column;gap:7px}
.lab ol li{counter-increment:l;position:relative;padding-left:32px;font-size:13.3px;line-height:1.66;color:var(--ink)}
.lab ol li:before{content:counter(l);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:rgba(61,220,155,.22);border:1px solid rgba(61,220,155,.5);color:#8ff0c6;
  font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lab .chk{margin-top:10px;background:rgba(61,220,155,.10);border:1px solid rgba(61,220,155,.35);
  border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink)}
.lab .chk b{color:var(--good);font-weight:900}
kbd{display:inline-block;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:rgba(255,255,255,.08);color:var(--ink)}
html[data-theme="light"] kbd{background:rgba(22,35,63,.06)}

.vsmock{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0d1426;font-size:12px}
html[data-theme="light"] .vsmock{background:#1e1e2e}
.vsmock .vstop{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#141b2f;color:#9fb0cf;font-size:11px}
.vsmock .vsdot{width:9px;height:9px;border-radius:50%;background:#ff6b81}
.vsmock .vsbody{display:grid;grid-template-columns:150px 1fr;min-height:150px}
.vsmock .vsside{border-right:1px solid rgba(255,255,255,.08);padding:8px;color:#9fb0cf;font-family:var(--mono);font-size:11px;line-height:1.9}
.vsmock .vsside .f{padding:1px 6px;border-radius:5px}
.vsmock .vsside .f.on{background:rgba(47,107,255,.25);color:#fff}
.vsmock .vsmain{padding:9px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:#cfd8f5}
.vsmock .vsmain .bp{color:#ff6b81}
.vsmock .vsterm{border-top:1px solid rgba(255,255,255,.08);padding:7px 12px;font-family:var(--mono);
  font-size:11px;color:#8ff0c6;background:#0a1020}

@media (max-width:1100px){
  #kbhint{display:none}
}
@media print{
  body{padding:0;background:#fff}
  #rail,#pager,#tools,#kbhint,#progress,#railToggle,.toast{display:none!important}
  #stage{gap:0;padding:0}
  .slide{transform:none!important;margin:0 0 6mm!important;break-inside:avoid;box-shadow:none;border:1px solid #ccc;width:1180px}
}

<body>
<div id="progress"></div>

<aside id="rail">
  <div class="rl-head">
    <b id="rlTitle">기초공학 프로그래밍 · 파이썬</b>
    <small id="rlSub">SCROLL · 목차를 눌러 이동</small>
  </div>
  <div class="rl-list" id="railList"></div>
</aside>
<button id="railToggle" onclick="toggleRail()">‹</button>

<div id="tools">
  <div class="langbtn">
    <button id="btnKo" class="on" onclick="setLang('ko')">한국어</button>
    <button id="btnEn" onclick="setLang('en')">English</button>
  </div>
  <button class="tool" id="btnTheme" onclick="toggleTheme()">밝은 화면</button>
  <button class="tool dl" id="hDl" onclick="downloadGame()">game.py 내려받기</button>
</div>

<div id="stage"></div>

<div id="pager">
  <button onclick="goSlide(0)" title="처음">&laquo;</button>
  <button onclick="stepSlide(-1)" title="이전">&lsaquo;</button>
  <span class="cnt" id="pgCnt">01 / 01</span>
  <button onclick="stepSlide(1)" title="다음">&rsaquo;</button>
  <button onclick="goSlide(-1)" title="마지막">&raquo;</button>
  <span class="sep"></span>
  <button onclick="zoom(-1)" title="축소">&minus;</button>
  <span class="zm" id="pgZoom">100%</span>
  <button onclick="zoom(1)" title="확대">+</button>
</div>
<div id="kbhint">PgUp/PgDn · ← → 이동 · + / − 크기 · M 목차 · L 언어 · T 테마</div>
<div class="toast" id="toast"></div>

<script>
var GAME_SRC = {"ko": "\"\"\"\nSPACE DEFENDER - 파이썬 기초 12장을 한 판에 담은 슈팅 게임\n실행: python game.py   (필요한 것: pip install pygame)\n조작: 화살표 좌우 이동 / 스페이스 발사 / P 잠시멈춤 / L 한영전환 / R 다시하기 / ESC 종료\n이 파일 옆에 highscore.json 이 생기고 최고점이 그 안에 저장됩니다\n\"\"\"\n\n# ===== 9장 · 모듈 : 남이 만들어 둔 도구 상자를 가져다 쓴다 =====\nimport os\nimport sys\nimport json\nimport math\nimport random\n\nimport pygame\n\n# ===== 1장 · 변수와 자료형 : 게임의 설정값을 이름에 담아 둔다 =====\nTITLE = \"SPACE DEFENDER\"          # 문자열 - 창 제목에 쓸 글자\nWIDTH = 640                        # 정수 - 창의 너비(픽셀)\nHEIGHT = 720                       # 정수 - 창의 높이(픽셀)\nFPS = 60                           # 정수 - 1초에 화면을 몇 번 새로 그릴지\nPLAYER_SPEED = 6.0                 # 실수 - 플레이어가 한 번에 움직이는 거리\nBULLET_SPEED = 11.0                # 실수 - 총알이 한 번에 올라가는 거리\nSTART_LIVES = 3                    # 정수 - 시작할 때 주는 목숨 수\nLANG = \"ko\"                        # 문자열 - 지금 쓰는 언어(게임 안에서 L 키로 바뀜)\nSAVE_FILE = \"highscore.json\"       # 문자열 - 최고점을 적어 둘 파일 이름\nSAVE_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)), SAVE_FILE)  # os 모듈로 이 파일이 있는 폴더 경로를 구해 파일 이름과 이어 붙인다\n\n# ===== 6장 · 리스트·튜플·딕셔너리 : 색과 설정값을 한 덩어리로 묶는다 =====\nCOLORS = {\n    \"bg\": (10, 14, 28),\n    \"player\": (86, 214, 255),\n    \"bullet\": (255, 228, 120),\n    \"enemy\": (255, 106, 122),\n    \"boss\": (188, 132, 255),\n    \"text\": (235, 240, 255),\n    \"dim\": (120, 132, 168),\n}\n\n# 딕셔너리 - 숫자 설정값을 이름으로 꺼내 쓴다(SETTINGS[\"enemy_speed\"])\nSETTINGS = {\n    \"spawn_delay\": 44,             # 적 무리가 나오는 간격 - 숫자를 줄이면 더 자주 나온다\n    \"enemy_speed\": 1.6,            # 적이 내려오는 기본 속도\n    \"level_up_score\": 120,         # 이 점수마다 단계가 하나 올라간다\n}\n\n# ===== 7장 · 문자열 : 화면에 띄울 글자를 언어별로 준비한다 =====\nTEXTS = {\n    \"ko\": {\n        \"score\": \"점수\",\n        \"lives\": \"목숨\",\n        \"level\": \"단계\",\n        \"best\": \"최고점\",\n        \"start\": \"스페이스바를 누르면 시작합니다\",\n        \"move\": \"화살표 좌우: 이동   스페이스: 발사   P: 잠시멈춤\",\n        \"pause\": \"잠시멈춤 - P를 누르면 계속합니다\",\n        \"over\": \"게임 끝\",\n        \"retry\": \"R: 다시하기    ESC: 나가기\",\n        \"boss\": \"보스 등장!\",\n        \"newbest\": \"새 최고점!\",\n    },\n    \"en\": {\n        \"score\": \"SCORE\",\n        \"lives\": \"LIVES\",\n        \"level\": \"LEVEL\",\n        \"best\": \"BEST\",\n        \"start\": \"Press SPACE to start\",\n        \"move\": \"LEFT/RIGHT: move   SPACE: fire   P: pause\",\n        \"pause\": \"PAUSED - press P to continue\",\n        \"over\": \"GAME OVER\",\n        \"retry\": \"R: retry    ESC: quit\",\n        \"boss\": \"BOSS INCOMING!\",\n        \"newbest\": \"NEW BEST!\",\n    },\n}\n\n\ndef t(key):\n    # 두 단계 딕셔너리에서 지금 언어의 글자를 꺼낸다\n    return TEXTS[LANG][key]\n\n\n# ===== 11장 · 파일 입출력 : 최고점을 json 파일에 적고 다시 읽는다 =====\ndef load_highscore():\n    # 파일에서 최고점을 읽어 온다 - with 를 쓰면 다 읽고 자동으로 닫힌다\n    # ===== 10장 · 예외처리 : 파일이 없거나 깨져 있어도 게임은 멈추지 않는다 =====\n    try:\n        with open(SAVE_PATH, \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n        return int(data[\"highscore\"])\n    except FileNotFoundError:\n        # 아직 저장 파일이 없는 첫 실행 - 최고점을 0으로 본다\n        return 0\n    except (json.JSONDecodeError, KeyError, ValueError):\n        # 파일이 깨졌거나 키가 없거나 숫자가 아님 - 역시 0으로 넘긴다\n        return 0\n\n\ndef save_highscore(score):\n    # 최고점을 파일에 적는다 - \"w\" 는 처음부터 새로 쓰는 모드\n    try:\n        with open(SAVE_PATH, \"w\", encoding=\"utf-8\") as f:\n            json.dump({\"highscore\": int(score)}, f, ensure_ascii=False, indent=2)\n    except OSError as e:\n        # 쓰기 권한이 없거나 디스크가 찼을 때 - 알리고 게임은 계속한다\n        print(\"save failed:\", e)\n\n\nFONT_CACHE = {}  # 빈 딕셔너리 - 한 번 만든 폰트를 크기별로 담아 두고 다시 쓴다\n\n\ndef load_font(size):\n    # 이미 만들어 둔 크기면 그것을 그대로 돌려준다(매 프레임 새로 만들면 느려진다)\n    if size in FONT_CACHE:\n        return FONT_CACHE[size]\n    # 한글 폰트가 없는 컴퓨터도 있으므로 실패하면 기본 폰트로 넘어간다\n    try:\n        font = pygame.font.SysFont(\"malgungothic\", size)\n    except Exception:\n        font = pygame.font.Font(None, size)\n    FONT_CACHE[size] = font\n    return font\n\n\n# ===== 5장 · 함수 : 여러 번 쓰는 일을 이름 붙여 묶어 둔다 =====\ndef draw_text(surface, text, size, x, y, color=COLORS[\"text\"], center=True):\n    # 글자를 화면에 그리는 일을 한 곳에 모아 둔다 - 6번 넘게 다시 쓴다\n    font = load_font(size)\n    image = font.render(str(text), True, color)\n    rect = image.get_rect()\n    if center:\n        rect.center = (x, y)\n    else:\n        rect.topleft = (x, y)\n    surface.blit(image, rect)\n    return rect\n\n\ndef distance(ax, ay, bx, by):\n    # 두 점 사이 거리를 돌려준다 - return 이 있으면 결과를 받아 쓸 수 있다\n    # ===== 2장 · 연산자 : 두 점 사이 거리를 빼기, 제곱, 제곱근으로 구한다 =====\n    return math.sqrt((ax - bx) ** 2 + (ay - by) ** 2)\n\n\ndef level_of(score):\n    # 점수를 넣으면 단계를 돌려준다 - 기본값 없이 매개변수 하나만 받는다\n    return score // SETTINGS[\"level_up_score\"] + 1\n\n\n# ===== 8장 · 클래스와 객체 : 플레이어·총알·적을 설계도로 찍어 낸다 =====\nclass GameObject:\n    # 모든 물체의 공통 설계도 - 위치·크기·색·속도·살아있는지를 갖는다\n\n    def __init__(self, x, y, size, color, speed):\n        # 생성자 - 객체를 만들 때 자동으로 한 번 불린다. self 는 만들어진 그 물체\n        self.x = float(x)\n        self.y = float(y)\n        self.size = size\n        self.color = color\n        self.speed = speed\n        self.alive = True\n\n    def rect(self):\n        # 중심 좌표에서 네모(충돌 판정에 쓰는 사각형)를 만들어 돌려준다\n        half = self.size / 2\n        return pygame.Rect(self.x - half, self.y - half, self.size, self.size)\n\n    def update(self):\n        # 자식이 각자 다시 쓸 자리 - 기본은 아무것도 하지 않는다\n        pass\n\n    def draw(self, surface):\n        pygame.draw.rect(surface, self.color, self.rect(), border_radius=6)\n\n\nclass Player(GameObject):\n    # GameObject 를 물려받은 플레이어 - 목숨과 발사 대기시간을 더 갖는다\n\n    def __init__(self):\n        super().__init__(WIDTH / 2, HEIGHT - 70, 42, COLORS[\"player\"], PLAYER_SPEED)\n        self.lives = START_LIVES\n        self.cooldown = 0\n\n    def update(self, keys=None):\n        # 부모의 update 를 덮어쓴다(오버라이딩) - 눌린 키를 받아 움직인다\n        if keys is None:\n            return\n        # ===== 3장 · 조건문 : 키가 눌렸는지, 화면 밖으로 나갔는지 판단한다 =====\n        if keys[pygame.K_LEFT]:\n            self.x -= self.speed\n        if keys[pygame.K_RIGHT]:\n            self.x += self.speed\n        # 화면 왼쪽 벽을 넘었으면 벽에 붙이고, 아니면 오른쪽 벽을 확인한다\n        if self.x < self.size / 2:\n            self.x = self.size / 2\n        elif self.x > WIDTH - self.size / 2:\n            self.x = WIDTH - self.size / 2\n        if self.cooldown > 0:\n            self.cooldown -= 1\n\n    def fire(self):\n        # 총알 하나를 만들어 돌려준다. 대기시간이 남았으면 None 을 돌려준다\n        if self.cooldown > 0:\n            return None\n        self.cooldown = 9\n        return Bullet(self.x, self.y - 26)\n\n    def draw(self, surface):\n        # 플레이어만 삼각형으로 그린다 - 부모의 그리기를 덮어쓴 것\n        nose = (self.x, self.y - self.size / 2)\n        left = (self.x - self.size / 2, self.y + self.size / 2)\n        right = (self.x + self.size / 2, self.y + self.size / 2)\n        pygame.draw.polygon(surface, self.color, [nose, left, right])\n\n\nclass Bullet(GameObject):\n    # 총알 - 위로만 올라가고 화면을 벗어나면 사라진다\n\n    def __init__(self, x, y):\n        super().__init__(x, y, 8, COLORS[\"bullet\"], BULLET_SPEED)\n\n    def update(self):\n        self.y -= self.speed\n        # 화면 위로 완전히 사라졌으면 살아있지 않다고 표시한다\n        if self.y < -10:\n            self.alive = False\n\n\nclass Enemy(GameObject):\n    # 적 - 아래로 내려오고, 체력과 점수를 갖는다\n\n    def __init__(self, x, y, speed):\n        super().__init__(x, y, 36, COLORS[\"enemy\"], speed)\n        self.hp = 1\n        self.points = 10\n\n    def update(self):\n        self.y += self.speed\n        if self.y > HEIGHT + 40:\n            self.alive = False\n\n    def hit(self):\n        # 맞았을 때 체력을 하나 깎고, 죽었으면 True 를 돌려준다\n        self.hp -= 1\n        if self.hp <= 0:\n            self.alive = False\n            return True\n        return False\n\n\nclass Boss(Enemy):\n    # Enemy 를 물려받은 보스 - 더 크고, 더 단단하고, 좌우로 움직인다\n\n    def __init__(self, x, y, speed, level):\n        super().__init__(x, y, speed * 0.55)\n        self.size = 86\n        self.color = COLORS[\"boss\"]\n        # 단계가 올라갈수록 보스 체력도 올라간다\n        self.hp = 6 + level * 2\n        self.points = 120\n        self.direction = 1\n\n    def update(self):\n        # 보스는 내려오면서 좌우로 움직인다 - 벽에 닿으면 방향을 뒤집는다\n        self.y += self.speed\n        self.x += self.direction * 2.4\n        if self.x < self.size / 2 or self.x > WIDTH - self.size / 2:\n            self.direction *= -1\n        if self.y > HEIGHT + 60:\n            self.alive = False\n\n    def draw(self, surface):\n        pygame.draw.rect(surface, self.color, self.rect(), border_radius=14)\n        pygame.draw.rect(surface, COLORS[\"bg\"], self.rect().inflate(-26, -46), border_radius=8)\n\n\n# ----- 5장 이어서 · 적 무리를 만들어 돌려주는 함수 -----\ndef spawn_wave(level):\n    # 적 무리를 만들어 리스트로 돌려준다 - level 값에 따라 결과가 달라진다\n    wave = []\n    # 단계가 올라갈수록 적을 더 많이 만든다 - range 는 0부터 그 수 앞까지 센다\n    for i in range(2 + level // 2):\n        x = random.randint(40, WIDTH - 40)\n        y = random.randint(-220, -40)\n        speed = SETTINGS[\"enemy_speed\"] + level * 0.22\n        wave.append(Enemy(x, y, speed))\n    # 단계를 5로 나눈 나머지가 0이면(5, 10, 15단계) 보스를 함께 내보낸다\n    if level % 5 == 0:\n        wave.append(Boss(WIDTH / 2, -140, SETTINGS[\"enemy_speed\"] + level * 0.22, level))\n    return wave\n\n\ndef new_game():\n    # 게임 상태 한 벌을 새로 만들어 돌려준다 - 다시하기도 이 함수 하나로 끝난다\n    return {\n        \"player\": Player(),\n        \"bullets\": [],\n        \"enemies\": [],\n        \"score\": 0,\n        \"level\": 1,\n        \"timer\": 0,\n        \"state\": \"ready\",\n        \"message\": \"\",\n        \"message_timer\": 0,\n    }\n\n\n# ===== 4장 · 반복문 : while 로 게임을 계속 돌리고 for 로 목록을 훑는다 =====\ndef main():\n    # 게임 전체를 담은 함수 - 창을 열고, 루프를 돌리고, 끝나면 닫는다\n    global LANG\n\n    pygame.init()\n    screen = pygame.display.set_mode((WIDTH, HEIGHT))\n    pygame.display.set_caption(TITLE)\n    clock = pygame.time.Clock()\n\n    highscore = load_highscore()\n    game = new_game()\n\n    running = True\n    # 게임 루프 - running 이 True 인 동안 한 프레임씩 끝없이 돌린다\n    while running:\n        clock.tick(FPS)\n\n        # 이번 프레임에 쌓인 키보드·마우스 사건을 하나씩 꺼내 본다\n        for event in pygame.event.get():\n            if event.type == pygame.QUIT:\n                running = False\n            elif event.type == pygame.KEYDOWN:\n                if event.key == pygame.K_ESCAPE:\n                    running = False\n                elif event.key == pygame.K_l:\n                    # 조건 표현식 - ko 였으면 en, 아니면 ko 로 한 줄에 뒤집는다\n                    LANG = \"en\" if LANG == \"ko\" else \"ko\"\n                elif event.key == pygame.K_p and game[\"state\"] == \"play\":\n                    game[\"state\"] = \"pause\"\n                elif event.key == pygame.K_p and game[\"state\"] == \"pause\":\n                    game[\"state\"] = \"play\"\n                elif event.key == pygame.K_SPACE and game[\"state\"] == \"ready\":\n                    game[\"state\"] = \"play\"\n                elif event.key == pygame.K_r and game[\"state\"] == \"over\":\n                    game = new_game()\n                    game[\"state\"] = \"play\"\n\n        keys = pygame.key.get_pressed()\n\n        # 게임 상태가 play 일 때만 움직임을 계산한다(ready·pause·over 는 멈춤)\n        if game[\"state\"] == \"play\":\n            player = game[\"player\"]\n            player.update(keys)\n\n            if keys[pygame.K_SPACE]:\n                bullet = player.fire()\n                # 발사 대기시간이 남아 있으면 fire() 가 None 을 주므로 그때는 넣지 않는다\n                if bullet is not None:\n                    game[\"bullets\"].append(bullet)\n\n            game[\"timer\"] += 1\n            # 흐른 프레임을 spawn_delay 로 나눈 나머지가 0인 순간마다 새 무리를 만든다\n            if game[\"timer\"] % SETTINGS[\"spawn_delay\"] == 0:\n                new_wave = spawn_wave(game[\"level\"])\n                # extend 는 목록에 목록을 이어 붙인다(append 는 하나만 넣는다)\n                game[\"enemies\"].extend(new_wave)\n                for obj in new_wave:\n                    if isinstance(obj, Boss):\n                        game[\"message\"] = t(\"boss\")\n                        game[\"message_timer\"] = 90\n\n            # 총알과 적을 각각 한 번씩 훑어 위치를 갱신한다\n            for bullet in game[\"bullets\"]:\n                bullet.update()\n            for enemy in game[\"enemies\"]:\n                enemy.update()\n\n            # 이중 반복문 - 모든 총알과 모든 적을 짝지어 맞았는지 본다\n            for bullet in game[\"bullets\"]:\n                for enemy in game[\"enemies\"]:\n                    if not bullet.alive or not enemy.alive:\n                        continue\n                    # 거리가 적의 반지름 + 총알 반지름보다 작으면 맞은 것으로 본다\n                    if distance(bullet.x, bullet.y, enemy.x, enemy.y) < (enemy.size / 2 + 6):\n                        bullet.alive = False\n                        if enemy.hit():\n                            game[\"score\"] += enemy.points\n\n            # 적이 플레이어와 겹쳤는지 확인한다 - colliderect 는 네모끼리 겹침 판정\n            for enemy in game[\"enemies\"]:\n                if enemy.alive and enemy.rect().colliderect(player.rect()):\n                    enemy.alive = False\n                    player.lives -= 1\n                    # 목숨이 0 이하로 떨어지면 게임을 끝내고, 최고점이면 파일에 적는다\n                    if player.lives <= 0:\n                        game[\"state\"] = \"over\"\n                        if game[\"score\"] > highscore:\n                            highscore = game[\"score\"]\n                            save_highscore(highscore)\n                            game[\"message\"] = t(\"newbest\")\n                            game[\"message_timer\"] = 150\n\n            # 리스트 컴프리헨션 - 살아있는 것만 남겨 새 목록으로 갈아 끼운다\n            game[\"bullets\"] = [b for b in game[\"bullets\"] if b.alive]\n            game[\"enemies\"] = [e for e in game[\"enemies\"] if e.alive]\n\n            # 점수를 기준 점수로 나눈 몫이 단계가 된다 - // 는 몫만 남기는 나눗셈\n            game[\"level\"] = level_of(game[\"score\"])\n\n            if game[\"message_timer\"] > 0:\n                game[\"message_timer\"] -= 1\n\n        # 여기서부터 그리기 - 배경을 먼저 칠하고 그 위에 물체를 얹는다\n        screen.fill(COLORS[\"bg\"])\n\n        for enemy in game[\"enemies\"]:\n            enemy.draw(screen)\n        for bullet in game[\"bullets\"]:\n            bullet.draw(screen)\n        game[\"player\"].draw(screen)\n\n        # f-문자열 - 중괄호 안에 값을 넣고 :>5 로 다섯 칸 오른쪽 맞춤을 한다\n        hud = f\"{t('score')} {game['score']:>5}   {t('level')} {game['level']}   {t('lives')} {'@' * game['player'].lives}\"\n        draw_text(screen, hud, 22, 16, 14, COLORS[\"text\"], center=False)\n        draw_text(screen, f\"{t('best')} {highscore}\", 20, WIDTH - 16, 16, COLORS[\"dim\"], center=False)\n\n        # 상태에 따라 시작 화면·멈춤 화면·끝 화면 중 하나를 덮어 그린다\n        if game[\"state\"] == \"ready\":\n            draw_text(screen, TITLE, 54, WIDTH / 2, HEIGHT / 2 - 40)\n            draw_text(screen, t(\"start\"), 26, WIDTH / 2, HEIGHT / 2 + 20)\n            draw_text(screen, t(\"move\"), 20, WIDTH / 2, HEIGHT / 2 + 60, COLORS[\"dim\"])\n        elif game[\"state\"] == \"pause\":\n            draw_text(screen, t(\"pause\"), 30, WIDTH / 2, HEIGHT / 2)\n        elif game[\"state\"] == \"over\":\n            draw_text(screen, t(\"over\"), 56, WIDTH / 2, HEIGHT / 2 - 30)\n            draw_text(screen, f\"{t('score')} {game['score']}\", 30, WIDTH / 2, HEIGHT / 2 + 20)\n            draw_text(screen, t(\"retry\"), 22, WIDTH / 2, HEIGHT / 2 + 70, COLORS[\"dim\"])\n\n        if game[\"message_timer\"] > 0:\n            draw_text(screen, game[\"message\"], 30, WIDTH / 2, 90, COLORS[\"boss\"])\n\n        pygame.display.flip()\n\n    # 루프를 빠져나오면 pygame 을 닫고 프로그램을 끝낸다\n    pygame.quit()\n    sys.exit()\n\n\n# ===== 9장 이어서 · 이 파일을 직접 실행했을 때만 게임을 켠다 =====\nif __name__ == \"__main__\":\n    # 이 파일을 직접 실행했을 때만 main() 을 부른다. 다른 곳에서 import 하면 부르지 않는다\n    main()\n", "en": "\"\"\"\nSPACE DEFENDER - a shooter that packs all 12 Python basics into one game\nRun: python game.py   (requires: pip install pygame)\nKeys: LEFT-RIGHT move / SPACE fire / P pause / L language / R retry / ESC quit\nA highscore.json file appears next to this file and keeps your best score\n\"\"\"\n\n# ===== Ch.9 Modules : borrow toolboxes other people already built =====\nimport os\nimport sys\nimport json\nimport math\nimport random\n\nimport pygame\n\n# ===== Ch.1 Variables and types : keep every setting in a named box =====\nTITLE = \"SPACE DEFENDER\"          # string - shown on the window title bar\nWIDTH = 640                        # int - window width in pixels\nHEIGHT = 720                       # int - window height in pixels\nFPS = 60                           # int - how many times per second we redraw\nPLAYER_SPEED = 6.0                 # float - how far the player moves per frame\nBULLET_SPEED = 11.0                # float - how far a bullet rises per frame\nSTART_LIVES = 3                    # int - how many lives you start with\nLANG = \"en\"                        # string - current language (L key flips it in game)\nSAVE_FILE = \"highscore.json\"       # string - file name that keeps the best score\nSAVE_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)), SAVE_FILE)  # use the os module to join this file's folder with the file name\n\n# ===== Ch.6 List, tuple, dict : bundle colors and settings together =====\nCOLORS = {\n    \"bg\": (10, 14, 28),\n    \"player\": (86, 214, 255),\n    \"bullet\": (255, 228, 120),\n    \"enemy\": (255, 106, 122),\n    \"boss\": (188, 132, 255),\n    \"text\": (235, 240, 255),\n    \"dim\": (120, 132, 168),\n}\n\n# dict - pull number settings out by name (SETTINGS[\"enemy_speed\"])\nSETTINGS = {\n    \"spawn_delay\": 44,             # gap between waves - a smaller number means more waves\n    \"enemy_speed\": 1.6,            # base falling speed of an enemy\n    \"level_up_score\": 120,         # each block of this many points raises the level\n}\n\n# ===== Ch.7 Strings : prepare on-screen text for each language =====\nTEXTS = {\n    \"ko\": {\n        \"score\": \"점수\",\n        \"lives\": \"목숨\",\n        \"level\": \"단계\",\n        \"best\": \"최고점\",\n        \"start\": \"스페이스바를 누르면 시작합니다\",\n        \"move\": \"화살표 좌우: 이동   스페이스: 발사   P: 잠시멈춤\",\n        \"pause\": \"잠시멈춤 - P를 누르면 계속합니다\",\n        \"over\": \"게임 끝\",\n        \"retry\": \"R: 다시하기    ESC: 나가기\",\n        \"boss\": \"보스 등장!\",\n        \"newbest\": \"새 최고점!\",\n    },\n    \"en\": {\n        \"score\": \"SCORE\",\n        \"lives\": \"LIVES\",\n        \"level\": \"LEVEL\",\n        \"best\": \"BEST\",\n        \"start\": \"Press SPACE to start\",\n        \"move\": \"LEFT/RIGHT: move   SPACE: fire   P: pause\",\n        \"pause\": \"PAUSED - press P to continue\",\n        \"over\": \"GAME OVER\",\n        \"retry\": \"R: retry    ESC: quit\",\n        \"boss\": \"BOSS INCOMING!\",\n        \"newbest\": \"NEW BEST!\",\n    },\n}\n\n\ndef t(key):\n    # pick the current language's text out of the two-level dict\n    return TEXTS[LANG][key]\n\n\n# ===== Ch.11 File I/O : write the best score to a json file and read it back =====\ndef load_highscore():\n    # read the best score from the file - with closes it for us afterwards\n    # ===== Ch.10 Exceptions : a missing or broken file must not stop the game =====\n    try:\n        with open(SAVE_PATH, \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n        return int(data[\"highscore\"])\n    except FileNotFoundError:\n        # first run with no save file yet - treat the best score as 0\n        return 0\n    except (json.JSONDecodeError, KeyError, ValueError):\n        # broken file, missing key or not a number - fall back to 0 as well\n        return 0\n\n\ndef save_highscore(score):\n    # write the best score to the file - \"w\" starts the file over\n    try:\n        with open(SAVE_PATH, \"w\", encoding=\"utf-8\") as f:\n            json.dump({\"highscore\": int(score)}, f, ensure_ascii=False, indent=2)\n    except OSError as e:\n        # no write permission or a full disk - report it and keep playing\n        print(\"save failed:\", e)\n\n\nFONT_CACHE = {}  # an empty dict - keep each font size once and reuse it\n\n\ndef load_font(size):\n    # return the cached font if we already built that size (rebuilding every frame is slow)\n    if size in FONT_CACHE:\n        return FONT_CACHE[size]\n    # some machines have no Korean font, so fall back to the default one\n    try:\n        font = pygame.font.SysFont(\"malgungothic\", size)\n    except Exception:\n        font = pygame.font.Font(None, size)\n    FONT_CACHE[size] = font\n    return font\n\n\n# ===== Ch.5 Functions : give a name to work you repeat =====\ndef draw_text(surface, text, size, x, y, color=COLORS[\"text\"], center=True):\n    # one place for drawing text on screen - we reuse it more than six times\n    font = load_font(size)\n    image = font.render(str(text), True, color)\n    rect = image.get_rect()\n    if center:\n        rect.center = (x, y)\n    else:\n        rect.topleft = (x, y)\n    surface.blit(image, rect)\n    return rect\n\n\ndef distance(ax, ay, bx, by):\n    # return the distance between two points - return hands the result back\n    # ===== Ch.2 Operators : distance from subtraction, power and square root =====\n    return math.sqrt((ax - bx) ** 2 + (ay - by) ** 2)\n\n\ndef level_of(score):\n    # give it a score, get a level back - one parameter, no default\n    return score // SETTINGS[\"level_up_score\"] + 1\n\n\n# ===== Ch.8 Classes and objects : stamp out player, bullet, enemy from blueprints =====\nclass GameObject:\n    # the shared blueprint - position, size, color, speed, alive flag\n\n    def __init__(self, x, y, size, color, speed):\n        # constructor - called once automatically when an object is made; self is that object\n        self.x = float(x)\n        self.y = float(y)\n        self.size = size\n        self.color = color\n        self.speed = speed\n        self.alive = True\n\n    def rect(self):\n        # build the box used for collision tests from the center point\n        half = self.size / 2\n        return pygame.Rect(self.x - half, self.y - half, self.size, self.size)\n\n    def update(self):\n        # a slot for children to rewrite - the default does nothing\n        pass\n\n    def draw(self, surface):\n        pygame.draw.rect(surface, self.color, self.rect(), border_radius=6)\n\n\nclass Player(GameObject):\n    # the player inherits GameObject and adds lives and a firing cooldown\n\n    def __init__(self):\n        super().__init__(WIDTH / 2, HEIGHT - 70, 42, COLORS[\"player\"], PLAYER_SPEED)\n        self.lives = START_LIVES\n        self.cooldown = 0\n\n    def update(self, keys=None):\n        # overrides the parent update - it takes the pressed keys and moves\n        if keys is None:\n            return\n        # ===== Ch.3 Conditionals : is the key down, did it leave the screen =====\n        if keys[pygame.K_LEFT]:\n            self.x -= self.speed\n        if keys[pygame.K_RIGHT]:\n            self.x += self.speed\n        # clamp to the left wall if it went past it, otherwise check the right wall\n        if self.x < self.size / 2:\n            self.x = self.size / 2\n        elif self.x > WIDTH - self.size / 2:\n            self.x = WIDTH - self.size / 2\n        if self.cooldown > 0:\n            self.cooldown -= 1\n\n    def fire(self):\n        # make and return one bullet, or None while the cooldown is left\n        if self.cooldown > 0:\n            return None\n        self.cooldown = 9\n        return Bullet(self.x, self.y - 26)\n\n    def draw(self, surface):\n        # the player draws as a triangle - another override of the parent\n        nose = (self.x, self.y - self.size / 2)\n        left = (self.x - self.size / 2, self.y + self.size / 2)\n        right = (self.x + self.size / 2, self.y + self.size / 2)\n        pygame.draw.polygon(surface, self.color, [nose, left, right])\n\n\nclass Bullet(GameObject):\n    # bullet - it only rises and disappears past the screen edge\n\n    def __init__(self, x, y):\n        super().__init__(x, y, 8, COLORS[\"bullet\"], BULLET_SPEED)\n\n    def update(self):\n        self.y -= self.speed\n        # mark it as not alive once it has gone fully off the top\n        if self.y < -10:\n            self.alive = False\n\n\nclass Enemy(GameObject):\n    # enemy - it falls, and it has hit points and a score value\n\n    def __init__(self, x, y, speed):\n        super().__init__(x, y, 36, COLORS[\"enemy\"], speed)\n        self.hp = 1\n        self.points = 10\n\n    def update(self):\n        self.y += self.speed\n        if self.y > HEIGHT + 40:\n            self.alive = False\n\n    def hit(self):\n        # take one hit point off, and return True if it died\n        self.hp -= 1\n        if self.hp <= 0:\n            self.alive = False\n            return True\n        return False\n\n\nclass Boss(Enemy):\n    # the boss inherits Enemy - bigger, tougher, and it sweeps sideways\n\n    def __init__(self, x, y, speed, level):\n        super().__init__(x, y, speed * 0.55)\n        self.size = 86\n        self.color = COLORS[\"boss\"]\n        # the boss gets more hit points as the level rises\n        self.hp = 6 + level * 2\n        self.points = 120\n        self.direction = 1\n\n    def update(self):\n        # the boss falls while sweeping sideways - it flips direction at a wall\n        self.y += self.speed\n        self.x += self.direction * 2.4\n        if self.x < self.size / 2 or self.x > WIDTH - self.size / 2:\n            self.direction *= -1\n        if self.y > HEIGHT + 60:\n            self.alive = False\n\n    def draw(self, surface):\n        pygame.draw.rect(surface, self.color, self.rect(), border_radius=14)\n        pygame.draw.rect(surface, COLORS[\"bg\"], self.rect().inflate(-26, -46), border_radius=8)\n\n\n# ----- Ch.5 continued : a function that builds and returns a wave -----\ndef spawn_wave(level):\n    # build a wave and return it as a list - the result depends on level\n    wave = []\n    # higher level means more enemies - range counts from 0 up to that number\n    for i in range(2 + level // 2):\n        x = random.randint(40, WIDTH - 40)\n        y = random.randint(-220, -40)\n        speed = SETTINGS[\"enemy_speed\"] + level * 0.22\n        wave.append(Enemy(x, y, speed))\n    # if the level divides by 5 (5, 10, 15) send a boss along with the wave\n    if level % 5 == 0:\n        wave.append(Boss(WIDTH / 2, -140, SETTINGS[\"enemy_speed\"] + level * 0.22, level))\n    return wave\n\n\ndef new_game():\n    # return a fresh game state - retry is just calling this once more\n    return {\n        \"player\": Player(),\n        \"bullets\": [],\n        \"enemies\": [],\n        \"score\": 0,\n        \"level\": 1,\n        \"timer\": 0,\n        \"state\": \"ready\",\n        \"message\": \"\",\n        \"message_timer\": 0,\n    }\n\n\n# ===== Ch.4 Loops : while keeps the game running, for walks the lists =====\ndef main():\n    # the whole game in one function - open the window, run the loop, close it\n    global LANG\n\n    pygame.init()\n    screen = pygame.display.set_mode((WIDTH, HEIGHT))\n    pygame.display.set_caption(TITLE)\n    clock = pygame.time.Clock()\n\n    highscore = load_highscore()\n    game = new_game()\n\n    running = True\n    # the game loop - one frame at a time while running stays True\n    while running:\n        clock.tick(FPS)\n\n        # walk the keyboard and mouse events collected in this frame\n        for event in pygame.event.get():\n            if event.type == pygame.QUIT:\n                running = False\n            elif event.type == pygame.KEYDOWN:\n                if event.key == pygame.K_ESCAPE:\n                    running = False\n                elif event.key == pygame.K_l:\n                    # conditional expression - flip ko to en, otherwise back to ko, in one line\n                    LANG = \"en\" if LANG == \"ko\" else \"ko\"\n                elif event.key == pygame.K_p and game[\"state\"] == \"play\":\n                    game[\"state\"] = \"pause\"\n                elif event.key == pygame.K_p and game[\"state\"] == \"pause\":\n                    game[\"state\"] = \"play\"\n                elif event.key == pygame.K_SPACE and game[\"state\"] == \"ready\":\n                    game[\"state\"] = \"play\"\n                elif event.key == pygame.K_r and game[\"state\"] == \"over\":\n                    game = new_game()\n                    game[\"state\"] = \"play\"\n\n        keys = pygame.key.get_pressed()\n\n        # only move things while the state is play (ready, pause, over stay still)\n        if game[\"state\"] == \"play\":\n            player = game[\"player\"]\n            player.update(keys)\n\n            if keys[pygame.K_SPACE]:\n                bullet = player.fire()\n                # fire() returns None while the cooldown is left, so add nothing then\n                if bullet is not None:\n                    game[\"bullets\"].append(bullet)\n\n            game[\"timer\"] += 1\n            # spawn a new wave each time the frame count divides by spawn_delay\n            if game[\"timer\"] % SETTINGS[\"spawn_delay\"] == 0:\n                new_wave = spawn_wave(game[\"level\"])\n                # extend joins a list onto a list (append puts in a single item)\n                game[\"enemies\"].extend(new_wave)\n                for obj in new_wave:\n                    if isinstance(obj, Boss):\n                        game[\"message\"] = t(\"boss\")\n                        game[\"message_timer\"] = 90\n\n            # walk the bullets and the enemies once each to update their positions\n            for bullet in game[\"bullets\"]:\n                bullet.update()\n            for enemy in game[\"enemies\"]:\n                enemy.update()\n\n            # nested loops - pair every bullet with every enemy to test for a hit\n            for bullet in game[\"bullets\"]:\n                for enemy in game[\"enemies\"]:\n                    if not bullet.alive or not enemy.alive:\n                        continue\n                    # if the distance is smaller than enemy radius + bullet radius, it is a hit\n                    if distance(bullet.x, bullet.y, enemy.x, enemy.y) < (enemy.size / 2 + 6):\n                        bullet.alive = False\n                        if enemy.hit():\n                            game[\"score\"] += enemy.points\n\n            # did an enemy overlap the player - colliderect tests box against box\n            for enemy in game[\"enemies\"]:\n                if enemy.alive and enemy.rect().colliderect(player.rect()):\n                    enemy.alive = False\n                    player.lives -= 1\n                    # when lives drop to 0 the game ends, and a new best is written to the file\n                    if player.lives <= 0:\n                        game[\"state\"] = \"over\"\n                        if game[\"score\"] > highscore:\n                            highscore = game[\"score\"]\n                            save_highscore(highscore)\n                            game[\"message\"] = t(\"newbest\")\n                            game[\"message_timer\"] = 150\n\n            # list comprehension - keep only the living ones as a fresh list\n            game[\"bullets\"] = [b for b in game[\"bullets\"] if b.alive]\n            game[\"enemies\"] = [e for e in game[\"enemies\"] if e.alive]\n\n            # the level is the score divided by the step score - // keeps only the quotient\n            game[\"level\"] = level_of(game[\"score\"])\n\n            if game[\"message_timer\"] > 0:\n                game[\"message_timer\"] -= 1\n\n        # drawing starts here - fill the background first, then stack objects on it\n        screen.fill(COLORS[\"bg\"])\n\n        for enemy in game[\"enemies\"]:\n            enemy.draw(screen)\n        for bullet in game[\"bullets\"]:\n            bullet.draw(screen)\n        game[\"player\"].draw(screen)\n\n        # f-string - put values in braces and right-align in five columns with :>5\n        hud = f\"{t('score')} {game['score']:>5}   {t('level')} {game['level']}   {t('lives')} {'@' * game['player'].lives}\"\n        draw_text(screen, hud, 22, 16, 14, COLORS[\"text\"], center=False)\n        draw_text(screen, f\"{t('best')} {highscore}\", 20, WIDTH - 16, 16, COLORS[\"dim\"], center=False)\n\n        # draw the start, pause or game-over overlay depending on the state\n        if game[\"state\"] == \"ready\":\n            draw_text(screen, TITLE, 54, WIDTH / 2, HEIGHT / 2 - 40)\n            draw_text(screen, t(\"start\"), 26, WIDTH / 2, HEIGHT / 2 + 20)\n            draw_text(screen, t(\"move\"), 20, WIDTH / 2, HEIGHT / 2 + 60, COLORS[\"dim\"])\n        elif game[\"state\"] == \"pause\":\n            draw_text(screen, t(\"pause\"), 30, WIDTH / 2, HEIGHT / 2)\n        elif game[\"state\"] == \"over\":\n            draw_text(screen, t(\"over\"), 56, WIDTH / 2, HEIGHT / 2 - 30)\n            draw_text(screen, f\"{t('score')} {game['score']}\", 30, WIDTH / 2, HEIGHT / 2 + 20)\n            draw_text(screen, t(\"retry\"), 22, WIDTH / 2, HEIGHT / 2 + 70, COLORS[\"dim\"])\n\n        if game[\"message_timer\"] > 0:\n            draw_text(screen, game[\"message\"], 30, WIDTH / 2, 90, COLORS[\"boss\"])\n\n        pygame.display.flip()\n\n    # once out of the loop, close pygame and end the program\n    pygame.quit()\n    sys.exit()\n\n\n# ===== Ch.9 continued : start the game only when this file is run directly =====\nif __name__ == \"__main__\":\n    # call main() only when this file is run directly, not when it is imported\n    main()\n"};

으로 구한다 =====", "    return math.sqrt((ax - bx) ** 2 + (ay - by) ** 2)", "", "", "def level_of(score):", "    # 점수를 넣으면 단계를 돌려준다 - 기본값 없이 매개변수 하나만 받는다", "    return score // SETTINGS[\"level_up_score\"] + 1"], "en": ["def distance(ax, ay, bx, by):", "    # return the distance between two points - return hands the result back", "    # ===== Ch.2 Operators : distance from subtraction, power and square root =====", "    return math.sqrt((ax - bx) ** 2 + (ay - by) ** 2)", "", "", "def level_of(score):", "    # give it a score, get a level back - one parameter, no default", "    return score // SETTINGS[\"level_up_score\"] + 1"]}, "ex_base": {"start": 150, "ko": ["# ===== 8장 · 클래스와 객체 : 플레이어·총알·적을 설계도로 찍어 낸다 =====", "class GameObject:", "    # 모든 물체의 공통 설계도 - 위치·크기·색·속도·살아있는지를 갖는다", "", "    def __init__(self, x, y, size, color, speed):", "        # 생성자 - 객체를 만들 때 자동으로 한 번 불린다. self 는 만들어진 그 물체", "        self.x = float(x)", "        self.y = float(y)", "        self.size = size", "        self.color = color", "        self.speed = speed", "        self.alive = True", "", "    def rect(self):", "        # 중심 좌표에서 네모(충돌 판정에 쓰는 사각형)를 만들어 돌려준다", "        half = self.size / 2", "        return pygame.Rect(self.x - half, self.y - half, self.size, self.size)", "", "    def update(self):", "        # 자식이 각자 다시 쓸 자리 - 기본은 아무것도 하지 않는다", "        pass", "", "    def draw(self, surface):", "        pygame.draw.rect(surface, self.color, self.rect(), border_radius=6)"], "en": ["# ===== Ch.8 Classes and objects : stamp out player, bullet, enemy from blueprints =====", "class GameObject:", "    # the shared blueprint - position, size, color, speed, alive flag", "", "    def __init__(self, x, y, size, color, speed):", "        # constructor - called once automatically when an object is made; self is that object", "        self.x = float(x)", "        self.y = float(y)", "        self.size = size", "        self.color = color", "        self.speed = speed", "        self.alive = True", "" function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===================== 파이썬 색칠 ===================== */
var KW = ('def class return if elif else for while break continue pass import from as try except finally raise with '+
          'global nonlocal lambda yield del assert not and or in is None True False async await').split(' ');
var BI = ('print len range int float str dict list tuple set open abs round isinstance min max enumerate zip sorted '+
          'sum type super sqrt randint choice format').split(' ');
function hlLine(line){
  var out = '', i = 0, n = line.length;
  while(i < n){
    var ch = line[i];
    if(ch === '#'){ out += '<span class="tk-cm">' + esc(line.slice(i)) + '</span>'; break; }
    if(ch === '"' || ch === "'"){
      var q = ch, j = i + 1;
      while(j < n){ if(line[j] === '\\'){ j += 2; continue; } if(line[j] === q){ j++; break; } j++; }
      out += '<span class="tk-str">' + esc(line.slice(i, j)) + '</span>'; i = j; continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      var j2 = i; while(j2 < n && /[A-Za-z0-9_]/.test(line[j2])) j2++;
      var w = line.slice(i, j2), before = line.slice(0, i);
      if((w === 'f' || w === 'r') && (line[j2] === '"' || line[j2] === "'")){
        var q2 = line[j2], k = j2 + 1;
        while(k < n){ if(line[k] === '\\'){ k += 2; continue; } if(line[k] === q2){ k++; break; } k++; }
        out += '<span class="tk-str">' + esc(line.slice(i, k)) + '</span>'; i = k; continue;
      }
      if(KW.indexOf(w) >= 0) out += '<span class="tk-kw">' + w + '</span>';
      else if(w === 'self') out += '<span class="tk-self">self</span>';
      else if(/(def|class)\s+$/.test(before)) out += '<span class="tk-def">' + w + '</span>';
      else if(BI.indexOf(w) >= 0) out += '<span class="tk-bi">' + w + '</span>';
      else out += esc(w);
      i = j2; continue;
    }
    if(/[0-9]/.test(ch)){
      var j3 = i; while(j3 < n && /[0-9._]/.test(line[j3])) j3++;
      out += '<span class="tk-num">' + line.slice(i, j3) + '</span>'; i = j3; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 1500);
}
function copyText(text, btn){
  function done(){
    toast(T(UI.copied));
    if(btn){ var old = btn.textContent; btn.textContent = '✓ ' + T(UI.copied); btn.classList.add('done');
      setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1400); }
  }
  function legacy(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Ctrl+C'); }
    document.body.removeChild(ta);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, legacy); return;
    }
  }catch(e){}
  legacy();
}
function saveFile(name, text){
  var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
}
